name: v3.26 selective singular structural screen

on:
  push:
    branches: [investigate/stockfish-search-gap]
    paths:
      - ".github/workflows/v326-singular-selective-screen.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    name: singular depth ${{ matrix.min_depth }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        min_depth: [10, 12]
    steps:
      - uses: actions/checkout@v4
      - name: Build combined baseline and selective singular candidate
        shell: bash
        run: |
          set -euo pipefail
          python tests/apply_v326_candidate.py --candidate no-check-extension
          python tests/apply_v326_candidate.py --candidate history-prune-64d
          make -C engine/build ENGINE=v325 native
          cp engine/c/zchezz_v325/zchezz.exe engine/c/zchezz_v325/zchezz_combined.exe

          python tests/apply_v326_singular_minimal.py \
            --mode tt-only --min-depth "${{ matrix.min_depth }}" --tt-lag 2
          rm -f engine/c/zchezz_v325/zchezz.exe
          make -C engine/build ENGINE=v325 native
          cp engine/c/zchezz_v325/zchezz.exe engine/c/zchezz_v325/zchezz_singular.exe

      - name: C invariants and UCI smoke
        shell: bash
        run: |
          set -euo pipefail
          make -C engine/build ENGINE=v325 test-c
          python tests/test_uci_extended.py --version v325 --only T1 --only T2

      - name: Fresh-position fixed-depth screen
        shell: bash
        run: |
          set -euo pipefail
          OUT="artifacts/singular-depth-${{ matrix.min_depth }}"
          python tests/bench_v326_candidate_structure.py \
            --baseline engine/c/zchezz_v325/zchezz_combined.exe \
            --candidate engine/c/zchezz_v325/zchezz_singular.exe \
            --output "$OUT"
          cat "$OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: singular-selective-depth-${{ matrix.min_depth }}-${{ github.run_id }}
          path: artifacts/singular-depth-${{ matrix.min_depth }}
