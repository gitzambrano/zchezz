name: v3.30 legality precheck

on:
  push:
    branches: [exp/v330-legal-precheck]
  workflow_dispatch:

jobs:
  ab:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: nodes512
            games: 500
            movetime: 0
            nodes: 512
            seed: 3300512
          - label: 50ms
            games: 300
            movetime: 50
            nodes: 0
            seed: 3300050
          - label: 200ms
            games: 160
            movetime: 200
            nodes: 0
            seed: 3300200
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify common baseline
        run: git diff --exit-code 1a1df3ebcc207a888c4355d512d582db73b3f24d HEAD -- engine/
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -e ".[all]"
      - name: Build untouched v3.23 baseline
        run: |
          make -C engine/build ENGINE=v323 clean native CC=gcc ARCH_FLAGS="-mavx2" STATIC_FLAG=""
          cp engine/c/zchezz_v323/zchezz.exe /tmp/base.exe
      - name: Materialize v3.30 legality-before-make candidate
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path('engine/c/zchezz_v323/main.c')
          s = main.read_text(encoding='utf-8')
          old = '#define ENGINE_VERSION "3.23"'
          assert s.count(old) == 1
          main.write_text(s.replace(old, '#define ENGINE_VERSION "3.30"', 1), encoding='utf-8')

          p = Path('engine/c/zchezz_v323/search.c')
          s = p.read_text(encoding='utf-8')
          anchor = 'static int qsearch(SearchState *ss, Board *b, int alpha, int beta, int ply) {'
          assert s.count(anchor) == 1
          helper = r'''
/* v3.30 experiment: prove pseudo-legal qsearch moves legal BEFORE board_make().
 * Uses post-move occupancy plus enemy bitboards with the captured piece masked.
 * qsearch never needs castling: in-check castling is illegal and normal QS only
 * generates captures/promotions. */
static inline int qmove_legal_precheck(const Board *b, const Move *m) {
    if (m->castle) return 0;
    uint8_t pc = b->b[m->from];
    if (!pc) return 0;
    int us = b->turn;
    int ksq = PC_TYPE(pc) == 6 ? (int)m->to : (us == COL_W ? b->wk : b->bk);
    uint64_t fromb = (uint64_t)1 << m->from;
    uint64_t tob   = (uint64_t)1 << m->to;
    uint64_t occ = (b->occ & ~fromb) | tob;
    uint64_t captured = 0;
    if (m->epc) {
        int csq = us == COL_W ? (int)m->to + 8 : (int)m->to - 8;
        captured = (uint64_t)1 << csq;
        occ &= ~captured;
    } else if (b->b[m->to] && PC_COLOR(b->b[m->to]) != us) {
        captured = tob;
    }
    uint64_t km = (uint64_t)1 << ksq;
    if (us == COL_W) {
        uint64_t bp = b->bb[6]  & ~captured;
        uint64_t bn = b->bb[7]  & ~captured;
        uint64_t bb = b->bb[8]  & ~captured;
        uint64_t br = b->bb[9]  & ~captured;
        uint64_t bq = b->bb[10] & ~captured;
        uint64_t bk = b->bb[11] & ~captured;
        if (wpawn_attacks_bb(km) & bp) return 0;
        if (NATK[ksq] & bn) return 0;
        if (bish_attacks(ksq, occ) & (bb | bq)) return 0;
        if (rook_attacks(ksq, occ) & (br | bq)) return 0;
        if (KATK[ksq] & bk) return 0;
    } else {
        uint64_t wp = b->bb[0] & ~captured;
        uint64_t wn = b->bb[1] & ~captured;
        uint64_t wb = b->bb[2] & ~captured;
        uint64_t wr = b->bb[3] & ~captured;
        uint64_t wq = b->bb[4] & ~captured;
        uint64_t wk = b->bb[5] & ~captured;
        if (bpawn_attacks_bb(km) & wp) return 0;
        if (NATK[ksq] & wn) return 0;
        if (bish_attacks(ksq, occ) & (wb | wq)) return 0;
        if (rook_attacks(ksq, occ) & (wr | wq)) return 0;
        if (KATK[ksq] & wk) return 0;
    }
    return 1;
}

'''
          s = s.replace(anchor, helper + anchor, 1)

          old1 = '''            board_make(b, &moves[i]);
            int prev_turn = b->turn ^ 24;
            if (board_is_attacked(b, prev_turn==COL_W ? b->wk : b->bk, b->turn)) {
                board_unmake(b); continue;
            }
            legal++;'''
          new1 = '''            if (!qmove_legal_precheck(b, &moves[i])) continue;
            board_make(b, &moves[i]);
            legal++;'''
          assert s.count(old1) == 1, s.count(old1)
          s = s.replace(old1, new1, 1)

          old2 = '''        board_make(b, &moves[i]);
        int mover_col = b->turn ^ 24;
        int king_sq   = mover_col == COL_W ? b->wk : b->bk;
        if (board_is_attacked(b, king_sq, b->turn)) { board_unmake(b); continue; }
        int sc = -qsearch(ss, b, -beta, -alpha, ply+1);'''
          new2 = '''        if (!qmove_legal_precheck(b, &moves[i])) continue;
        board_make(b, &moves[i]);
        int sc = -qsearch(ss, b, -beta, -alpha, ply+1);'''
          assert s.count(old2) == 1, s.count(old2)
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          make -C engine/build ENGINE=v323 clean native CC=gcc ARCH_FLAGS="-mavx2" STATIC_FLAG=""
          cp engine/c/zchezz_v323/zchezz.exe /tmp/cand.exe
          printf 'uci\nquit\n' | /tmp/cand.exe | grep -F 'id name Zchezz 3.30'
          python tests/test_perft.py --version v323 --max-depth 4
      - name: Generate common deterministic openings
        env:
          OPENING_SEED: ${{ matrix.seed }}
        run: |
          mkdir -p tests/arena_results
          python - <<'PY'
          import os, random, chess
          from pathlib import Path
          r=random.Random(int(os.environ['OPENING_SEED'])); out=[]; seen=set()
          while len(out)<256:
              b=chess.Board(); ok=True
              for _ in range(r.randint(8,22)):
                  ms=list(b.legal_moves)
                  if not ms: ok=False; break
                  qs=[m for m in ms if not b.is_capture(m)]
                  b.push(r.choice(qs if qs and r.random()<.72 else ms))
                  if b.is_game_over(claim_draw=True): ok=False; break
              if not ok: continue
              k=' '.join(b.fen().split()[:4])
              if k not in seen: seen.add(k); out.append(k)
          Path('tests/arena_results/openings.epd').write_text('\n'.join(out)+'\n')
          PY
      - name: A/B ${{ matrix.label }}
        run: |
          python tests/run_arena.py \
            --player uci:/tmp/cand.exe --player uci:/tmp/base.exe \
            --games ${{ matrix.games }} --movetime ${{ matrix.movetime }} --nodes ${{ matrix.nodes }} \
            --threads 2 --max-plies 300 \
            --openings "$GITHUB_WORKSPACE/tests/arena_results/openings.epd" --opening-plies 0 \
            --seed ${{ matrix.seed }} --tt-mb 8 \
            --json "tests/arena_results/${{ matrix.label }}.json" \
            --pgn "tests/arena_results/${{ matrix.label }}.pgn"
      - uses: actions/upload-artifact@v4
        with:
          name: v330-legal-precheck-${{ matrix.label }}
          path: tests/arena_results/
