name: v3.30 compact TT

on:
  push:
    branches: [exp/v330-compact-tt]
  workflow_dispatch:

jobs:
  ab:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: nodes512, games: 500, movetime: 0, nodes: 512, seed: 3300512}
          - {label: 50ms, games: 300, movetime: 50, nodes: 0, seed: 3300050}
          - {label: 200ms, games: 160, movetime: 200, nodes: 0, seed: 3300200}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify common baseline
        run: git diff --exit-code 1a1df3ebcc207a888c4355d512d582db73b3f24d HEAD -- engine/
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -e ".[all]"
      - name: Build untouched v3.23 baseline
        run: |
          make -C engine/build ENGINE=v323 clean native CC=gcc ARCH_FLAGS="-mavx2" STATIC_FLAG=""
          cp engine/c/zchezz_v323/zchezz.exe /tmp/base.exe
      - name: Materialize v3.30 compact-TT candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          main=Path('engine/c/zchezz_v323/main.c'); s=main.read_text(encoding='utf-8')
          old='#define ENGINE_VERSION "3.23"'; assert s.count(old)==1
          main.write_text(s.replace(old,'#define ENGINE_VERSION "3.30"',1),encoding='utf-8')

          h=Path('engine/c/zchezz_v323/search.h'); s=h.read_text(encoding='utf-8')
          pairs=[
            ('extern uint64_t TT_H[TT_SIZE];', 'extern uint32_t TT_H[TT_SIZE];'),
            ('extern int32_t  TT_S[TT_SIZE];', 'extern int16_t  TT_S[TT_SIZE];'),
            ('extern int32_t  TT_D[TT_SIZE];', 'extern uint16_t TT_D[TT_SIZE];'),
            ('extern uint16_t TT_G[TT_SIZE];', 'extern uint8_t  TT_G[TT_SIZE];'),
            ('extern int32_t  TT_M[TT_SIZE];', 'extern uint32_t TT_M[TT_SIZE];'),
            ('extern int32_t  TT_E[TT_SIZE];', 'extern int16_t  TT_E[TT_SIZE];'),
            ('extern uint16_t TT_GEN;', 'extern uint8_t TT_GEN;'),
          ]
          for a,b in pairs:
              assert s.count(a)==1,(a,s.count(a)); s=s.replace(a,b,1)
          h.write_text(s,encoding='utf-8')

          p=Path('engine/c/zchezz_v323/search.c'); s=p.read_text(encoding='utf-8')
          defs=[
            ('uint64_t TT_H[TT_SIZE];','uint32_t TT_H[TT_SIZE];'),
            ('int32_t  TT_S[TT_SIZE];','int16_t  TT_S[TT_SIZE];'),
            ('int32_t  TT_D[TT_SIZE];','uint16_t TT_D[TT_SIZE];'),
            ('uint16_t TT_G[TT_SIZE];','uint8_t  TT_G[TT_SIZE];'),
            ('int32_t  TT_M[TT_SIZE];','uint32_t TT_M[TT_SIZE];'),
            ('int32_t  TT_E[TT_SIZE];','int16_t  TT_E[TT_SIZE];'),
            ('uint16_t TT_GEN = 0;','uint8_t TT_GEN = 0;'),
          ]
          for a,b in defs:
              assert s.count(a)==1,(a,s.count(a)); s=s.replace(a,b,1)

          a='''    int slot = (int)(hash & TT_MASK);
    int base = slot * TT_BUCKETS;
    int stored_score = tt_score_store(score, ply);'''
          b='''    int slot = (int)(hash & TT_MASK);
    int base = slot * TT_BUCKETS;
    /* v3.30: lower hash bits select the slot; keep an independent 32-bit
     * upper signature. Stockfish uses an even shorter TT signature. */
    uint32_t key32 = (uint32_t)(hash >> 32);
    int stored_score = tt_score_store(score, ply);'''
          assert s.count(a)==1,s.count(a); s=s.replace(a,b,1)
          s=s.replace('TT_H[base] = hash; TT_S[base] = stored_score;',
                      'TT_H[base] = key32; TT_S[base] = (int16_t)stored_score;',1)
          s=s.replace('TT_H[base+1] = hash; TT_S[base+1] = stored_score;',
                      'TT_H[base+1] = key32; TT_S[base+1] = (int16_t)stored_score;',1)

          a='''    int slot = (int)(hash & TT_MASK);
    int base = slot * TT_BUCKETS;

    /* Check both buckets */'''
          b='''    int slot = (int)(hash & TT_MASK);
    int base = slot * TT_BUCKETS;
    uint32_t key32 = (uint32_t)(hash >> 32);

    /* Check both buckets */'''
          assert s.count(a)==1,s.count(a); s=s.replace(a,b,1)
          assert s.count('if (TT_H[idx] != hash) continue;')==1
          s=s.replace('if (TT_H[idx] != hash) continue;','if (TT_H[idx] != key32) continue;',1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          make -C engine/build ENGINE=v323 clean native CC=gcc ARCH_FLAGS="-mavx2" STATIC_FLAG=""
          cp engine/c/zchezz_v323/zchezz.exe /tmp/cand.exe
          printf 'uci\nquit\n' | /tmp/cand.exe | grep -F 'id name Zchezz 3.30'
          python tests/test_perft.py --version v323 --max-depth 4
      - name: Generate common deterministic openings
        env: {OPENING_SEED: '${{ matrix.seed }}'}
        run: |
          mkdir -p tests/arena_results
          python - <<'PY'
          import os,random,chess
          from pathlib import Path
          r=random.Random(int(os.environ['OPENING_SEED'])); out=[]; seen=set()
          while len(out)<256:
              b=chess.Board(); ok=True
              for _ in range(r.randint(8,22)):
                  ms=list(b.legal_moves)
                  if not ms: ok=False; break
                  qs=[m for m in ms if not b.is_capture(m)]
                  b.push(r.choice(qs if qs and r.random()<.72 else ms))
                  if b.is_game_over(claim_draw=True): ok=False; break
              if not ok: continue
              k=' '.join(b.fen().split()[:4])
              if k not in seen: seen.add(k); out.append(k)
          Path('tests/arena_results/openings.epd').write_text('\n'.join(out)+'\n')
          PY
      - name: A/B ${{ matrix.label }}
        run: |
          python tests/run_arena.py --player uci:/tmp/cand.exe --player uci:/tmp/base.exe \
            --games ${{ matrix.games }} --movetime ${{ matrix.movetime }} --nodes ${{ matrix.nodes }} \
            --threads 2 --max-plies 300 --openings "$GITHUB_WORKSPACE/tests/arena_results/openings.epd" \
            --opening-plies 0 --seed ${{ matrix.seed }} --tt-mb 8 \
            --json "tests/arena_results/${{ matrix.label }}.json" --pgn "tests/arena_results/${{ matrix.label }}.pgn"
      - uses: actions/upload-artifact@v4
        with:
          name: v330-compact-tt-${{ matrix.label }}
          path: tests/arena_results/
