name: freeze v3.27 deep5 candidate

on:
  push:
    branches: [investigate/stockfish-search-gap]
    paths:
      - ".github/workflows/v327-freeze-deep5.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize candidate branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main v327-search-efficiency v327-deep5-candidate
          git worktree add -B v327-deep5-candidate /tmp/v327-candidate origin/main
          git show origin/v327-search-efficiency:tests/apply_v327_candidate.py > /tmp/apply_v327_candidate.py
          cd /tmp/v327-candidate
          python /tmp/apply_v327_candidate.py --candidate lmr-pos-deep5 --source engine/c/zchezz_v326/search.c
      - name: Correctness before freezing
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v327-candidate
          make -C engine/build ENGINE=v326 STATIC_FLAG= ARCH_FLAGS= TB_DEFS=-DNO_TABLEBASES native
          make -C engine/build ENGINE=v326 STATIC_FLAG= ARCH_FLAGS= test-c
          python tests/test_perft.py --version v326
          python tests/test_uci_extended.py --version v326
          python tools/check_nnue.py --profile v326
      - name: Commit exact candidate snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v327-candidate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/c/zchezz_v326/search.c
          git diff --cached --quiet && { echo "No candidate diff"; exit 1; }
          git commit -m "feat(v327): materialize deep5 LMR candidate"
          git push --force-with-lease origin HEAD:v327-deep5-candidate
