name: v326 history score distribution

on:
  push:
    branches: [v326-search-efficiency]
    paths:
      - "tests/instrument_v325_history_distribution.py"
      - "tests/bench_history_distribution.py"
      - ".github/workflows/v326-history-distribution.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts
        run: |
          set -euo pipefail
          python -m py_compile tests/instrument_v325_history_distribution.py tests/bench_history_distribution.py
          git diff --check
      - name: Build baseline
        run: |
          set -euo pipefail
          make -C engine/build ENGINE=v325 native
          cp engine/c/zchezz_v325/zchezz.exe engine/c/zchezz_v325/zchezz_baseline.exe
      - name: Build history diagnostic
        run: |
          set -euo pipefail
          python tests/instrument_v325_history_distribution.py
          rm -f engine/c/zchezz_v325/zchezz.exe
          make -C engine/build ENGINE=v325 native
          cp engine/c/zchezz_v325/zchezz.exe engine/c/zchezz_v325/zchezz_history_diag.exe
          git checkout -- engine/c/zchezz_v325/search.c
      - name: Run parity-gated distribution benchmark
        run: |
          set -euo pipefail
          python tests/bench_history_distribution.py
          cat artifacts/history-distribution/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v326-history-distribution-${{ github.run_id }}
          path: artifacts/history-distribution
