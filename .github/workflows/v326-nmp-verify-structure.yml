name: v3.26 NMP verification structural screen

on:
  push:
    branches: [investigate/stockfish-search-gap]
    paths:
      - ".github/workflows/v326-nmp-verify-structure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural:
    name: structural (verify-depth-${{ matrix.verify_depth }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        verify_depth: [10, 12]
    steps:
      - uses: actions/checkout@v4
      - name: Build combined baseline and verified NMP+2 candidate
        shell: bash
        run: |
          set -euo pipefail
          SRC=engine/c/zchezz_v325/search.c

          python tests/apply_v326_candidate.py --candidate no-check-extension
          python tests/apply_v326_candidate.py --candidate history-prune-64d
          make -C engine/build ENGINE=v325 native
          cp engine/c/zchezz_v325/zchezz.exe engine/c/zchezz_v325/zchezz_baseline.exe

          python tests/apply_v326_candidate.py --candidate nmp-plus2
          python tests/apply_v326_nmp_verify.py --verify-depth "${{ matrix.verify_depth }}"
          rm -f engine/c/zchezz_v325/zchezz.exe
          make -C engine/build ENGINE=v325 native
          make -C engine/build ENGINE=v325 test-c
          cp engine/c/zchezz_v325/zchezz.exe engine/c/zchezz_v325/zchezz_candidate.exe
          git checkout -- "$SRC"

      - name: Fresh-position fixed-depth screen
        shell: bash
        run: |
          set -euo pipefail
          OUT="artifacts/nmp-verify-${{ matrix.verify_depth }}"
          python tests/bench_v326_candidate_structure.py --output "$OUT"
          cat "$OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nmp-verify-structure-${{ matrix.verify_depth }}-${{ github.run_id }}
          path: artifacts/nmp-verify-${{ matrix.verify_depth }}
