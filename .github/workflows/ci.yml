name: isolated-v335-perf
on:
  push: {branches: [experiments/hotpath-matrix-20261104]}
  workflow_dispatch:
permissions: {contents: read}
jobs:
  perf_studies:
    name: perf study (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [lmr_piece, qs_order, qs_evasion_tt, fasthead_off, probcut_off, prefetch_off]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install python-chess numpy
      - run: python tools/perf_hotpaths.py --variant "${{ matrix.variant }}" --bench-depth 11 --games 6 --movetime 200
