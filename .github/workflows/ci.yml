name: isolated-v335-cache-stage3
on:
  push: {branches: [experiments/search-cache-stage3-20261106]}
  workflow_dispatch:
permissions: {contents: read}
jobs:
  perf_studies:
    name: cache study (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 155
    strategy:
      fail-fast: false
      matrix:
        variant: [probcut_depth6, probcut_depth7, fasthead_qs_off, fasthead_qs_margin350, qs_see_reuse, tt_prefetch_l0, cmh_second_off, tt_prefetch_l3, qs_no_ttprobe]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install python-chess numpy
      - name: Paired AVX2/native NPS and 200 ms H2H
        shell: bash
        run: |
          case "${{ matrix.variant }}" in tt_prefetch_l3|qs_no_ttprobe) openings=12 ;; *) openings=100 ;; esac
          python tools/perf_hotpaths.py --variant "${{ matrix.variant }}" --bench-depth 11 --games "$openings" --movetime 200 --concurrency 2 --max-plies 240 --opening-count 160
