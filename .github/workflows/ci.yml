name: isolated-v335-nnue-tt-stage5
on:
  push: {branches: [experiments/nnue-tt-stage5-20261108]}
  workflow_dispatch:
permissions: {contents: read}
jobs:
  perf:
    name: ${{ matrix.variant }} (seed ${{ matrix.seed }})
    runs-on: ubuntu-24.04
    timeout-minutes: 135
    strategy:
      fail-fast: false
      matrix:
        include:
          - {variant: nnue_relu_reuse, seed: 20261108}
          - {variant: nnue_relu_reuse, seed: 20261109}
          - {variant: nnue_relu_reuse, seed: 20261110}
          - {variant: nnue_relu_reuse_qs_off, seed: 20261111}
          - {variant: nnue_relu_reuse_qs_margin350, seed: 20261112}
          - {variant: nnue_relu_reuse_cache32, seed: 20261113}
          - {variant: nnue_extcache64, seed: 20261114}
          - {variant: tt_index_shiftmask, seed: 20261115}
          - {variant: nnue_relu_reuse_tt_mask, seed: 20261116}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install python-chess numpy
      - name: Build -march=native, perft, depth-8 equivalence, bench and 200 paired games
        run: python tools/perf_hotpaths.py --variant "${{ matrix.variant }}" --seed "${{ matrix.seed }}" --bench-depth 11 --games 100 --movetime 200 --concurrency 2 --max-plies 240 --opening-count 220
