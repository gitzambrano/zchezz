name: isolated-v335-nnue-stage4
on:
  push: {branches: [experiments/nnue-hotpath-stage4-20261106]}
  workflow_dispatch:
permissions: {contents: read}
jobs:
  perf_studies:
    name: nnue study (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    strategy:
      fail-fast: false
      matrix:
        variant: [nnue_relu_reuse, nnue_extcache32]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install python-chess numpy
      - name: Paired host-native NPS, NNUE equivalence and selfplay
        shell: bash
        run: |
          case "${{ matrix.variant }}" in nnue_relu_reuse) openings=100 ;; *) openings=12 ;; esac
          python tools/perf_hotpaths.py --variant "${{ matrix.variant }}" --bench-depth 11 --games "$openings" --movetime 200 --concurrency 2 --max-plies 240 --opening-count 160
