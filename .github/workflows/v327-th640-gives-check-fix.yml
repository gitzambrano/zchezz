name: v3.27 th640 plus gives-check correctness fix

on:
  push:
    branches: [v327-th640-gives-check-fix]
    paths:
      - ".github/workflows/v327-th640-gives-check-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-screen-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize frozen th640 baseline and corrected candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin v327-deep5-th640-candidate v327-search-efficiency
          git worktree add --detach /tmp/base origin/v327-deep5-th640-candidate
          git worktree add --detach /tmp/cand origin/v327-deep5-th640-candidate
          git show "$GITHUB_SHA":tests/apply_v327_gives_check_complete_fix.py > /tmp/cand/tests/apply_v327_gives_check_complete_fix.py
          cd /tmp/cand
          python tests/apply_v327_gives_check_complete_fix.py
          git show origin/v327-search-efficiency:tests/bench_v327_candidate_structure.py > tests/bench_v327_candidate_structure.py

          make -C /tmp/base/engine/build ENGINE=v326 STATIC_FLAG= ARCH_FLAGS= TB_DEFS=-DNO_TABLEBASES native
          make -C /tmp/cand/engine/build ENGINE=v326 STATIC_FLAG= ARCH_FLAGS= TB_DEFS=-DNO_TABLEBASES native
          cp /tmp/base/engine/c/zchezz_v326/zchezz.exe /tmp/cand/engine/c/zchezz_v326/zchezz_baseline.exe
          cp /tmp/cand/engine/c/zchezz_v326/zchezz.exe /tmp/cand/engine/c/zchezz_v326/zchezz_candidate.exe
          make -C /tmp/cand/engine/build TOOLS_ENGINE=v500 STATIC_FLAG= ARCH_FLAGS= arena

      - name: Correctness suite
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/cand
          make -C engine/build ENGINE=v326 STATIC_FLAG= ARCH_FLAGS= test-c
          python tests/test_perft.py --version v326
          python tests/test_uci_extended.py --version v326
          python tools/check_nnue.py --profile v326

      - name: Prove exact pawn-discovery and en-passant target moves
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/cand
          cp engine/c/zchezz_v326/search.c /tmp/search.fixed.c
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('engine/c/zchezz_v326/search.c')
          s=p.read_text(encoding='utf-8')
          pat=re.compile(r'if \(gpt>=3\|\|gpt==2\|\|m->prom\|\|m->epc\|\|\(gdr>gdc\?gdr:gdc\)<=2\|\|pawn_discovery\)\s*\n\s*gives_check = board_in_check\(b\);')
          body='''if (gpt>=3||gpt==2||m->prom||m->epc||(gdr>gdc?gdr:gdc)<=2||pawn_discovery) {
                  int exact_gc = board_in_check(b);
                  if ((pawn_discovery || m->epc) && exact_gc)
                      fprintf(stderr, "[GCHECK_FIX] from=%d to=%d pawn=%d ep=%d exact=1%c",
                              m->from, m->to, pawn_discovery, m->epc ? 1 : 0, 10);
                  gives_check = exact_gc;
              }'''
          s,n=pat.subn(body,s)
          if n != 4:
              raise RuntimeError(f'expected four fixed probe blocks, found {n}')
          p.write_text(s,encoding='utf-8')
          PY
          rm -f engine/c/zchezz_v326/zchezz.exe
          make -C engine/build ENGINE=v326 STATIC_FLAG= ARCH_FLAGS= TB_DEFS=-DNO_TABLEBASES native
          printf 'uci\nisready\nposition fen 4k3/8/8/3n4/4P3/8/8/K3R3 w - - 0 1\ngo depth 6\nquit\n' | engine/c/zchezz_v326/zchezz.exe >/tmp/pawn.out 2>/tmp/pawn.err
          printf 'uci\nisready\nposition fen 7k/8/8/3Pp3/8/8/8/B6K w - e6 0 1\ngo depth 6\nquit\n' | engine/c/zchezz_v326/zchezz.exe >/tmp/ep.out 2>/tmp/ep.err
          grep -q '\[GCHECK_FIX\].*from=36.*to=27.*pawn=1.*ep=0.*exact=1' /tmp/pawn.err
          grep -q '\[GCHECK_FIX\].*from=27.*to=20.*pawn=0.*ep=1.*exact=1' /tmp/ep.err
          cp /tmp/search.fixed.c engine/c/zchezz_v326/search.c
          rm -f engine/c/zchezz_v326/zchezz.exe
          make -C engine/build ENGINE=v326 STATIC_FLAG= ARCH_FLAGS= TB_DEFS=-DNO_TABLEBASES native
          cp engine/c/zchezz_v326/zchezz.exe engine/c/zchezz_v326/zchezz_candidate.exe

      - name: Structural fixed-depth screen
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/cand
          OUT=artifacts/v327-th640-gives-check-structure
          PYTHONPATH=tests python tests/bench_v327_candidate_structure.py \
            --baseline engine/c/zchezz_v326/zchezz_baseline.exe \
            --candidate engine/c/zchezz_v326/zchezz_candidate.exe \
            --source engine/c/zchezz_v326/main.c \
            --output "$OUT"
          cat "$OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare pinned paired UHO block
        shell: bash
        env:
          BOOK_COMMIT: 65815ccdbc7727cd4f6aee252ba8f67fb740e92f
        run: |
          set -euo pipefail
          cd /tmp/cand
          mkdir -p artifacts/uho
          URL="https://raw.githubusercontent.com/official-stockfish/books/${BOOK_COMMIT}/UHO_4060_v4.epd.zip"
          curl -L --fail --retry 3 --retry-delay 2 "$URL" -o artifacts/uho/uho.zip
          EPD_NAME="$(unzip -Z1 artifacts/uho/uho.zip | grep -Ei '\.epd$' | head -n1)"
          unzip -p artifacts/uho/uho.zip "$EPD_NAME" > artifacts/uho/all.epd
          python - <<'PY'
          from pathlib import Path
          import random
          lines=[]
          for raw in Path('artifacts/uho/all.epd').read_text(encoding='utf-8',errors='replace').splitlines():
              s=raw.strip()
              if not s or s.startswith('#'): continue
              p=s.split()
              if len(p)>=4: lines.append(' '.join(p[:4]))
          rng=random.Random(327512)
          rng.shuffle(lines)
          chosen=lines[6200:6250]
          if len(chosen)!=50:
              raise RuntimeError(f'expected 50 openings, got {len(chosen)}')
          Path('artifacts/uho/openings.epd').write_text('\n'.join(chosen)+'\n',encoding='utf-8')
          PY

      - name: 100-game serial antithetic strength gate at 200 ms
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/cand
          OUT=artifacts/v327-th640-gives-check-strength
          mkdir -p "$OUT"
          ./engine/build/arena.exe \
            --player "uci:$(realpath engine/c/zchezz_v326/zchezz_baseline.exe)" \
            --player "uci:$(realpath engine/c/zchezz_v326/zchezz_candidate.exe)" \
            --games 100 --threads 1 --movetime 200 --nodes 0 --max-plies 400 \
            --openings artifacts/uho/openings.epd --seed 327512 \
            --tt-mb 64 --uci-timeout 15000 \
            --json "$OUT/result.json" --pgn "$OUT/games.pgn" 2>&1 | tee "$OUT/arena.log"
          python - <<'PY'
          from pathlib import Path
          import json, math
          p=json.loads(Path('artifacts/v327-th640-gives-check-strength/result.json').read_text())['pairings'][0]
          w,d,l=int(p['l']),int(p['d']),int(p['w'])
          n=w+d+l
          s=(w+0.5*d)/n
          elo=400*math.log10(s/(1-s)) if 0<s<1 else 0.0
          text=f'Candidate W-D-L: {w}-{d}-{l}\nScore: {100*s:.2f}%\nElo: {elo:+.1f}\n'
          Path('artifacts/v327-th640-gives-check-strength/summary.txt').write_text(text)
          print(text)
          PY
          cat "$OUT/summary.txt" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v327-th640-gives-check-${{ github.run_id }}
          path: |
            /tmp/cand/artifacts/v327-th640-gives-check-structure
            /tmp/cand/artifacts/v327-th640-gives-check-strength

      - name: Freeze source-only corrected th640 branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/cand
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/c/zchezz_v326/search.c
          git diff --cached --quiet && { echo "No source diff"; exit 1; }
          git commit -m "fix(v327): combine th640 with complete gives-check detection"
          git push --force-with-lease=refs/heads/v327-th640-gives-check-fix:${GITHUB_SHA} origin HEAD:refs/heads/v327-th640-gives-check-fix
