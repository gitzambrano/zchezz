name: v324-pawn-correction

on:
  workflow_dispatch:
  push:
    branches: [exp/v324-pawn-correction]

permissions:
  contents: read

env:
  STATIC_FLAG: ""

jobs:
  pawn-correction-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -e ".[all]"

      - name: Build untouched v3.23 baseline
        shell: bash
        run: |
          set -euo pipefail
          make -C engine/build ENGINE=v323 clean native CC=gcc ARCH_FLAGS="-mavx2" STATIC_FLAG=""
          cp engine/c/zchezz_v323/zchezz.exe /tmp/zchezz-v323-base.exe
          cp engine/c/zchezz_v323/nnue_weights.bin /tmp/nnue_weights.bin

      - name: Apply pawn correction and build candidate
        shell: bash
        run: |
          set -euo pipefail
          python tools/v324_apply_pawn_correction.py
          git diff --check
          git diff -- engine/c/zchezz_v323/search.c | tee /tmp/v324-pawn-correction.diff
          make -C engine/build ENGINE=v323 clean native CC=gcc ARCH_FLAGS="-mavx2" STATIC_FLAG=""
          cp engine/c/zchezz_v323/zchezz.exe /tmp/zchezz-v324-pawncorr.exe
          python tests/test_perft.py --version v323 --max-depth 4
          python tests/test_uci_extended.py --version v323 --only T1 --only T2 --only T6 --only T9

      - name: Generate deterministic opening pool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/arena_results
          python - <<'PY'
          import random, chess
          from pathlib import Path
          rng=random.Random(32417)
          rows=[]; seen=set()
          while len(rows)<192:
              b=chess.Board(); ok=True
              for _ in range(rng.randint(8,20)):
                  moves=list(b.legal_moves)
                  if not moves: ok=False; break
                  quiet=[m for m in moves if not b.is_capture(m)]
                  b.push(rng.choice(quiet if quiet and rng.random()<0.72 else moves))
                  if b.is_game_over(claim_draw=True): ok=False; break
              if not ok: continue
              key=' '.join(b.fen().split()[:4])
              if key not in seen:
                  seen.add(key); rows.append(key)
          Path('tests/arena_results/v324_pawncorr_openings.epd').write_text('\n'.join(rows)+'\n')
          print('openings',len(rows))
          PY

      - name: Fixed-depth tree and median NPS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,statistics,subprocess,time
          from pathlib import Path
          w='/tmp/nnue_weights.bin'
          def bench(exe):
              t=time.perf_counter(); p=subprocess.run([exe,'--nnue',w,'bench','11'],capture_output=True,text=True,check=True)
              dt=time.perf_counter()-t; txt=p.stdout+p.stderr
              n=int(re.search(r'Total nodes\s*:\s*(\d+)',txt).group(1))
              return n,n/dt
          B=[]; C=[]
          for i in range(7):
              order=(('b','/tmp/zchezz-v323-base.exe'),('c','/tmp/zchezz-v324-pawncorr.exe')) if i%2==0 else (('c','/tmp/zchezz-v324-pawncorr.exe'),('b','/tmp/zchezz-v323-base.exe'))
              for k,e in order: (B if k=='b' else C).append(bench(e))
          bn=B[0][0]; cn=C[0][0]
          b=statistics.median(x[1] for x in B); c=statistics.median(x[1] for x in C)
          out={'baseline_nodes':bn,'candidate_nodes':cn,'tree_delta_pct':100*(cn/bn-1),'baseline_median_nps':b,'candidate_median_nps':c,'nps_delta_pct':100*(c/b-1)}
          print(json.dumps(out,indent=2)); Path('tests/arena_results/v324_pawncorr_tree.json').write_text(json.dumps(out,indent=2))
          PY

      - name: 800-game 512-node A/B versus v3.23
        shell: bash
        run: |
          set -euo pipefail
          python tests/run_arena.py \
            --player uci:/tmp/zchezz-v324-pawncorr.exe \
            --player uci:/tmp/zchezz-v323-base.exe \
            --games 800 --movetime 0 --nodes 512 --threads 2 --max-plies 300 \
            --openings "$GITHUB_WORKSPACE/tests/arena_results/v324_pawncorr_openings.epd" \
            --opening-plies 0 --seed 32418 --tt-mb 8 \
            --json tests/arena_results/v324_pawncorr_512.json \
            --pgn tests/arena_results/v324_pawncorr_512.pgn

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v324-pawn-correction-results
          path: |
            tests/arena_results/v324_pawncorr_openings.epd
            tests/arena_results/v324_pawncorr_tree.json
            tests/arena_results/v324_pawncorr_512.json
            tests/arena_results/v324_pawncorr_512.pgn
            /tmp/v324-pawn-correction.diff
          if-no-files-found: warn
