name: v507 baseline
on:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  v506-v328:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - name: Build baselines
        run: |
          make -C engine/build ENGINE=v506 STATIC_FLAG= ARCH_FLAGS= native
          make -C engine/build ENGINE=v328 STATIC_FLAG= ARCH_FLAGS= native
      - name: 5.06 vs 3.28 at 200 ms
        run: |
          python tests/_run_tournament_quick_core.py \
            --engine-a engine/c/zchezz_v506/zchezz.exe --label-a v506 \
            --engine-b engine/c/zchezz_v328/zchezz.exe --label-b v328 \
            --threads 1 --movetime 200 --concurrency 2 --games 50 \
            --max-plies 400 --no-pgn --no-epd --no-bin \
            --results-dir tests/quick_results/v506-v328
  v506-stockfish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - name: Install Stockfish
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y stockfish
          SF="$(command -v stockfish || true)"
          if [ -z "$SF" ] && [ -x /usr/games/stockfish ]; then SF=/usr/games/stockfish; fi
          echo "ZCHEZZ_STOCKFISH=$SF" >> "$GITHUB_ENV"
          printf 'uci\nquit\n' | "$SF" | sed -n '1,4p'
      - name: Build v5.06
        run: make -C engine/build ENGINE=v506 STATIC_FLAG= ARCH_FLAGS= native
      - name: 5.06 vs Stockfish at 200 ms
        run: |
          python tests/benchmark.py --profile v506 \
            --games 50 --movetime 200 --threads 1 --concurrency 2 \
            --max-plies 400 --no-pgn --no-epd --no-bin \
            --results-dir tests/quick_results/v506-stockfish
