name: v507-trust-robust

on:
  push:
    branches: [exp/v507-policy-trust]
    paths: [.github/workflows/v507-trust-robust.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  robust:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      BOOKS_SHA: 65815ccdbc7727cd4f6aee252ba8f67fb740e92f
      UHO_ZIP: UHO_4060_v4.epd.zip
      UHO_EPD: /tmp/uho/UHO_4060_v4.epd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - name: Build frozen trust candidate and predecessor
        run: |
          make -C engine/build ENGINE=v506 STATIC_FLAG= ARCH_FLAGS=-mavx2 native
          make -C engine/build ENGINE=v507r STATIC_FLAG= ARCH_FLAGS=-mavx2 native
      - name: Candidate smoke
        if: matrix.shard == 0
        run: |
          EXE="$GITHUB_WORKSPACE/engine/c/zchezz_v507r/zchezz.exe"
          python tests/test_perft.py --exe "$EXE"
          python tests/test_uci_extended.py --exe "$EXE"
          OUT="$(printf 'uci\nsetoption name Hash value 64\nisready\nquit\n' | "$EXE" 2>&1)"
          printf '%s\n' "$OUT"
          grep -q 'id name Zchezz 5.07' <<< "$OUT"
          grep -q 'requested=64 MB' <<< "$OUT"
      - name: Prepare pinned UHO openings
        run: |
          mkdir -p /tmp/uho
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/official-stockfish/books/${BOOKS_SHA}/${UHO_ZIP}" \
            -o "/tmp/${UHO_ZIP}"
          unzip -q "/tmp/${UHO_ZIP}" -d /tmp/uho
          test -s "${UHO_EPD}"
      - name: 50-game paired shard vs v5.06
        run: |
          SEED=$((5073100 + ${{ matrix.shard }}))
          python tests/experiments/h2h_uci_paired.py \
            --engine-a engine/c/zchezz_v507r/zchezz.exe \
            --engine-b engine/c/zchezz_v506/zchezz.exe \
            --label-a v507-trust --label-b v506 \
            --pairs 25 --movetime-ms 200 --hash-mb 64 --threads 1 \
            --opening-file "${UHO_EPD}" --opening-seed "$SEED" --max-plies 400 \
            --json "/tmp/trust-${{ matrix.shard }}.json"
          cat "/tmp/trust-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: v507-trust-${{ matrix.shard }}
          path: /tmp/trust-${{ matrix.shard }}.json
