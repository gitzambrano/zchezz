name: v3.27 th640 IIR depth screen

on:
  push:
    branches: [v327-th640-iir-screen]
    paths:
      - ".github/workflows/v327-th640-iir-screen.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: IIR min depth ${{ matrix.depth }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        depth: [4,5,6]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize frozen th640 baseline and IIR candidate
        shell: bash
        env:
          MIN_DEPTH: ${{ matrix.depth }}
        run: |
          set -euo pipefail
          git fetch origin v327-deep5-th640-candidate v327-search-efficiency
          git worktree add --detach /tmp/base origin/v327-deep5-th640-candidate
          git worktree add --detach /tmp/cand origin/v327-deep5-th640-candidate
          cd /tmp/cand
          python - <<'PY'
          from pathlib import Path
          import os
          md=int(os.environ['MIN_DEPTH'])
          p=Path('engine/c/zchezz_v326/search.c')
          s=p.read_text(encoding='utf-8')
          old='if (!pv_move.from && !pv_move.to && depth>=3 && !in_check && depth-1>=2) depth--;'
          new=f'if (!pv_move.from && !pv_move.to && depth>={md} && !in_check) depth--;'
          if s.count(old)!=1: raise RuntimeError(f'expected one baseline IIR condition, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git show origin/v327-search-efficiency:tests/bench_v327_candidate_structure.py > tests/bench_v327_candidate_structure.py
          make -C /tmp/base/engine/build ENGINE=v326 STATIC_FLAG= ARCH_FLAGS= TB_DEFS=-DNO_TABLEBASES native
          make -C /tmp/cand/engine/build ENGINE=v326 STATIC_FLAG= ARCH_FLAGS= TB_DEFS=-DNO_TABLEBASES native
          cp /tmp/base/engine/c/zchezz_v326/zchezz.exe /tmp/cand/engine/c/zchezz_v326/zchezz_baseline.exe
          cp /tmp/cand/engine/c/zchezz_v326/zchezz.exe /tmp/cand/engine/c/zchezz_v326/zchezz_candidate.exe
          make -C /tmp/cand/engine/build TOOLS_ENGINE=v500 STATIC_FLAG= ARCH_FLAGS= arena
      - name: Correctness smoke
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/cand
          make -C engine/build ENGINE=v326 STATIC_FLAG= ARCH_FLAGS= test-c
          python tests/test_perft.py --version v326
          python tests/test_uci_extended.py --version v326
          python tools/check_nnue.py --profile v326
      - name: Structural fixed-depth screen against th640
        shell: bash
        env:
          MIN_DEPTH: ${{ matrix.depth }}
        run: |
          set -euo pipefail
          cd /tmp/cand
          OUT="artifacts/v327-th640-iir-d${MIN_DEPTH}-structure"
          PYTHONPATH=tests python tests/bench_v327_candidate_structure.py \
            --baseline engine/c/zchezz_v326/zchezz_baseline.exe \
            --candidate engine/c/zchezz_v326/zchezz_candidate.exe \
            --source engine/c/zchezz_v326/main.c \
            --output "$OUT"
          cat "$OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare identical pinned UHO block
        shell: bash
        env:
          BOOK_COMMIT: 65815ccdbc7727cd4f6aee252ba8f67fb740e92f
        run: |
          set -euo pipefail
          cd /tmp/cand
          mkdir -p artifacts/uho
          URL="https://raw.githubusercontent.com/official-stockfish/books/${BOOK_COMMIT}/UHO_4060_v4.epd.zip"
          curl -L --fail --retry 3 --retry-delay 2 "$URL" -o artifacts/uho/uho.zip
          EPD_NAME="$(unzip -Z1 artifacts/uho/uho.zip | grep -Ei '\.epd$' | head -n1)"
          unzip -p artifacts/uho/uho.zip "$EPD_NAME" > artifacts/uho/all.epd
          python - <<'PY'
          from pathlib import Path
          import random
          lines=[]
          for raw in Path('artifacts/uho/all.epd').read_text(encoding='utf-8',errors='replace').splitlines():
              s=raw.strip()
              if not s or s.startswith('#'): continue
              p=s.split()
              if len(p)>=4: lines.append(' '.join(p[:4]))
          rng=random.Random(327456); rng.shuffle(lines)
          chosen=lines[5000:5050]
          if len(chosen)!=50: raise RuntimeError(f'expected 50 openings, got {len(chosen)}')
          Path('artifacts/uho/openings.epd').write_text('\n'.join(chosen)+'\n',encoding='utf-8')
          PY
      - name: 100-game serial antithetic fast gate at 200 ms
        shell: bash
        env:
          MIN_DEPTH: ${{ matrix.depth }}
        run: |
          set -euo pipefail
          cd /tmp/cand
          OUT="artifacts/v327-th640-iir-d${MIN_DEPTH}"
          mkdir -p "$OUT"
          ./engine/build/arena.exe \
            --player "uci:$(realpath engine/c/zchezz_v326/zchezz_baseline.exe)" \
            --player "uci:$(realpath engine/c/zchezz_v326/zchezz_candidate.exe)" \
            --games 100 --threads 1 --movetime 200 --nodes 0 --max-plies 400 \
            --openings artifacts/uho/openings.epd --seed 327456 \
            --tt-mb 64 --uci-timeout 15000 \
            --json "$OUT/result.json" --pgn "$OUT/games.pgn" 2>&1 | tee "$OUT/arena.log"
          cat "$OUT/result.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v327-th640-iir-d${{ matrix.depth }}-${{ github.run_id }}
          path: |
            /tmp/cand/artifacts/v327-th640-iir-d${{ matrix.depth }}-structure
            /tmp/cand/artifacts/v327-th640-iir-d${{ matrix.depth }}

  aggregate:
    name: aggregate IIR screen
    runs-on: ubuntu-24.04
    if: always()
    needs: [candidate]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v327-th640-iir-d*-*
          path: downloaded
          merge-multiple: false
      - name: Aggregate candidate perspective
        shell: python
        run: |
          from pathlib import Path
          import json, math, re
          rows=[]
          for root in sorted(Path('downloaded').iterdir()):
              results=list(root.glob('**/result.json'))
              metrics=list(root.glob('**/metrics.json'))
              if len(results)!=1 or len(metrics)!=1: continue
              m=re.search(r'iir-d(\d+)-',root.name)
              if not m: continue
              depth=int(m.group(1))
              pair=json.loads(results[0].read_text())['pairings'][0]
              w,d,l=int(pair['l']),int(pair['d']),int(pair['w'])
              n=w+d+l; s=(w+0.5*d)/n
              elo=400*math.log10(s/(1-s)) if 0<s<1 else 0.0
              second=(w+0.25*d)/n; var=max(0.0,second-s*s); se=math.sqrt(var/n)
              deriv=400/math.log(10)/(s*(1-s)) if 0<s<1 else 0.0
              ci=1.96*deriv*se
              st=json.loads(metrics[0].read_text())['summary']['12']
              rows.append((depth,w,d,l,s,elo,ci,st['node_delta_pct'],st['result_diffs']))
          if len(rows)!=3: raise RuntimeError(f'expected 3 candidates, got {len(rows)}')
          lines=['# v3.27 th640 IIR depth screen','',
                 'Candidate perspective versus frozen deep5-th640; 100 games each; 200 ms/move; Threads=1; serial arena; Hash=64 MB; tablebases disabled; same paired UHO block.','',
                 '| IIR min depth | W-D-L | Score | Elo | 95% CI | d12 nodes | d12 diffs |','|---:|---:|---:|---:|---:|---:|---:|']
          for dep,w,d,l,s,elo,ci,nd,diffs in sorted(rows):
              lines.append(f'| {dep} | {w}-{d}-{l} | {100*s:.2f}% | {elo:+.1f} | ±{ci:.1f} | {nd:+.2f}% | {diffs}/20 |')
          Path('aggregate.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print(Path('aggregate.md').read_text())
      - run: cat aggregate.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: v327-th640-iir-aggregate-${{ github.run_id }}
          path: aggregate.md
