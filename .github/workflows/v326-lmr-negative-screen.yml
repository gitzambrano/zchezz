name: v3.26 negative-only LMR screen

on:
  push:
    branches: [investigate/stockfish-search-gap]
    paths:
      - ".github/workflows/v326-lmr-negative-screen.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correctness:
    name: correctness (${{ matrix.candidate }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        candidate: [lmr-negative-512, lmr-negative-1024]
    steps:
      - uses: actions/checkout@v4
      - name: Apply combined base and candidate
        shell: bash
        run: |
          set -euo pipefail
          python tests/apply_v326_candidate.py --candidate no-check-extension
          python tests/apply_v326_candidate.py --candidate history-prune-64d
          python tests/apply_v326_candidate.py --candidate "${{ matrix.candidate }}"
      - name: Correctness suite
        shell: bash
        run: |
          set -euo pipefail
          make -C engine/build ENGINE=v325 native
          make -C engine/build ENGINE=v325 test-c
          python tests/test_perft.py --version v325
          python tests/test_uci_extended.py --version v325

  structural:
    name: structural (${{ matrix.candidate }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        candidate: [lmr-negative-512, lmr-negative-1024]
    steps:
      - uses: actions/checkout@v4
      - name: Build combined baseline and candidate
        shell: bash
        run: |
          set -euo pipefail
          python tests/apply_v326_candidate.py --candidate no-check-extension
          python tests/apply_v326_candidate.py --candidate history-prune-64d
          make -C engine/build ENGINE=v325 native
          cp engine/c/zchezz_v325/zchezz.exe engine/c/zchezz_v325/zchezz_combined.exe
          python tests/apply_v326_candidate.py --candidate "${{ matrix.candidate }}"
          rm -f engine/c/zchezz_v325/zchezz.exe
          make -C engine/build ENGINE=v325 native
          cp engine/c/zchezz_v325/zchezz.exe engine/c/zchezz_v325/zchezz_candidate.exe
      - name: Fresh-position fixed-depth screen
        shell: bash
        run: |
          set -euo pipefail
          OUT="artifacts/structure-${{ matrix.candidate }}"
          python tests/bench_v326_candidate_structure.py \
            --baseline engine/c/zchezz_v325/zchezz_combined.exe \
            --candidate engine/c/zchezz_v325/zchezz_candidate.exe \
            --output "$OUT"
          cat "$OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: lmr-negative-structure-${{ matrix.candidate }}-${{ github.run_id }}
          path: artifacts/structure-${{ matrix.candidate }}

  h2h:
    name: UHO H2H 200ms (${{ matrix.candidate }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        candidate: [lmr-negative-512, lmr-negative-1024]
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - name: Build combined baseline, candidate and arena
        shell: bash
        run: |
          set -euo pipefail
          SRC=engine/c/zchezz_v325/search.c
          python tests/apply_v326_candidate.py --candidate no-check-extension
          python tests/apply_v326_candidate.py --candidate history-prune-64d
          make -C engine/build ENGINE=v325 native
          cp engine/c/zchezz_v325/zchezz.exe engine/c/zchezz_v325/zchezz_combined.exe
          python tests/apply_v326_candidate.py --candidate "${{ matrix.candidate }}"
          rm -f engine/c/zchezz_v325/zchezz.exe
          make -C engine/build ENGINE=v325 native
          cp engine/c/zchezz_v325/zchezz.exe engine/c/zchezz_v325/zchezz_candidate.exe
          git checkout -- "$SRC"
          make -C engine/build ENGINE=v325 arena
      - name: Fetch pinned Stockfish UHO book
        shell: bash
        env:
          BOOK_COMMIT: 65815ccdbc7727cd4f6aee252ba8f67fb740e92f
          SHARD: ${{ matrix.shard }}
          CANDIDATE: ${{ matrix.candidate }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/book artifacts/h2h
          URL="https://raw.githubusercontent.com/official-stockfish/books/${BOOK_COMMIT}/UHO_4060_v4.epd.zip"
          curl -L --fail --retry 3 --retry-delay 2 "$URL" -o artifacts/book/uho.zip
          sha256sum artifacts/book/uho.zip | tee artifacts/book/uho.sha256
          EPD_NAME="$(unzip -Z1 artifacts/book/uho.zip | grep -Ei '\.epd$' | head -n1)"
          unzip -p artifacts/book/uho.zip "$EPD_NAME" > artifacts/book/all.epd
          python - <<'PY'
          from pathlib import Path
          import os, random
          shard=int(os.environ['SHARD'])
          lines=[]
          for raw in Path('artifacts/book/all.epd').read_text(encoding='utf-8',errors='replace').splitlines():
              p=raw.strip().split()
              if len(p)>=4 and not raw.lstrip().startswith('#'):
                  lines.append(' '.join(p[:4]))
          rng=random.Random(326913)
          rng.shuffle(lines)
          chosen=lines[shard*50:(shard+1)*50]
          if len(chosen)!=50: raise RuntimeError(f'expected 50 openings, got {len(chosen)}')
          Path('artifacts/h2h/openings.epd').write_text('\n'.join(chosen)+'\n',encoding='utf-8')
          PY
      - name: 100-game serial antithetic H2H at 200 ms
        shell: bash
        run: |
          set -euo pipefail
          OUT=artifacts/h2h
          BASE="$(realpath engine/c/zchezz_v325/zchezz_combined.exe)"
          CAND="$(realpath engine/c/zchezz_v325/zchezz_candidate.exe)"
          SEED=$((331000 + ${{ matrix.shard }}))
          ./engine/build/arena.exe \
            --player "uci:${BASE}" --player "uci:${CAND}" \
            --games 100 --threads 1 --movetime 200 --nodes 0 --max-plies 400 \
            --openings "$OUT/openings.epd" --seed "$SEED" --tt-mb 64 --uci-timeout 15000 \
            --json "$OUT/result.json" --pgn "$OUT/games.pgn" 2>&1 | tee "$OUT/arena.log"
          cat "$OUT/result.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lmr-negative-h2h-${{ matrix.candidate }}-s${{ matrix.shard }}-${{ github.run_id }}
          path: artifacts/h2h

  aggregate:
    name: aggregate negative-only LMR
    runs-on: ubuntu-24.04
    if: always()
    needs: [h2h]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lmr-negative-h2h-*
          path: downloaded
          merge-multiple: false
      - name: Aggregate
        shell: python
        run: |
          from pathlib import Path
          import json, math, re
          rows={}
          for p in Path('downloaded').glob('**/result.json'):
              m=re.match(r'lmr-negative-h2h-(lmr-negative-(?:512|1024))-s[01]-',p.parts[1])
              if not m: continue
              pair=json.loads(p.read_text())['pairings'][0]
              r=rows.setdefault(m.group(1),{'w':0,'d':0,'l':0})
              r['w']+=int(pair['l']); r['d']+=int(pair['d']); r['l']+=int(pair['w'])
          out=['# Negative-only LMR UHO screen','', '| Candidate | W-D-L | Score | Elo | 95% CI |','|---|---:|---:|---:|---:|']
          for cand in sorted(rows):
              r=rows[cand]; n=r['w']+r['d']+r['l']; s=(r['w']+0.5*r['d'])/n
              elo=400*math.log10(s/(1-s)) if 0<s<1 else 0
              second=(r['w']+0.25*r['d'])/n; var=max(0.0,second-s*s); se=math.sqrt(var/n)
              deriv=400/math.log(10)/(s*(1-s)) if 0<s<1 else 0; ci=1.96*deriv*se
              out.append(f"| {cand} | {r['w']}-{r['d']}-{r['l']} | {100*s:.2f}% | {elo:+.1f} | ±{ci:.1f} |")
          Path('aggregate.md').write_text('\n'.join(out)+'\n')
          print(Path('aggregate.md').read_text())
      - run: cat aggregate.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: lmr-negative-aggregate-${{ github.run_id }}
          path: aggregate.md
