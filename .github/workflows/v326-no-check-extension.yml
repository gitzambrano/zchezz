name: v326 no blanket check extension

on:
  push:
    branches: [v326-search-efficiency]
    paths:
      - "tests/apply_v326_candidate.py"
      - "tests/bench_v326_candidate_structure.py"
      - ".github/workflows/v326-no-check-extension.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts
        run: |
          set -euo pipefail
          python -m py_compile tests/apply_v326_candidate.py tests/bench_v326_candidate_structure.py
          git diff --check
      - name: Build baseline
        run: |
          set -euo pipefail
          make -C engine/build ENGINE=v325 native
          cp engine/c/zchezz_v325/zchezz.exe engine/c/zchezz_v325/zchezz_baseline.exe
      - name: Build no-check-extension candidate
        run: |
          set -euo pipefail
          python tests/apply_v326_candidate.py --candidate no-check-extension
          rm -f engine/c/zchezz_v325/zchezz.exe
          make -C engine/build ENGINE=v325 native
          cp engine/c/zchezz_v325/zchezz.exe engine/c/zchezz_v325/zchezz_candidate.exe
          git checkout -- engine/c/zchezz_v325/search.c
      - name: Run fixed-depth structural screen
        run: |
          set -euo pipefail
          python tests/bench_v326_candidate_structure.py
          cat artifacts/v326-candidate-structure/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v326-no-check-extension-${{ github.run_id }}
          path: artifacts/v326-candidate-structure
