name: v326 pruning effectiveness diagnostics

on:
  push:
    branches: [v326-search-efficiency]
    paths:
      - "tests/instrument_v325_pruning.py"
      - "tests/bench_pruning_efficiency.py"
      - ".github/workflows/v326-pruning-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate diagnostic scripts
        run: |
          set -euo pipefail
          python -m py_compile tests/instrument_v325_pruning.py tests/bench_pruning_efficiency.py
          git diff --check

      - name: Build baseline v3.25
        run: |
          set -euo pipefail
          make -C engine/build ENGINE=v325 native
          cp engine/c/zchezz_v325/zchezz.exe engine/c/zchezz_v325/zchezz_baseline.exe

      - name: Build pruning diagnostic v3.25
        run: |
          set -euo pipefail
          python tests/instrument_v325_pruning.py
          rm -f engine/c/zchezz_v325/zchezz.exe
          make -C engine/build ENGINE=v325 native
          cp engine/c/zchezz_v325/zchezz.exe engine/c/zchezz_v325/zchezz_prune_diag.exe
          git checkout -- engine/c/zchezz_v325/search.c

      - name: Run parity-gated pruning diagnostics
        run: |
          set -euo pipefail
          python tests/bench_pruning_efficiency.py
          cat artifacts/pruning-efficiency/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v326-pruning-diagnostics-${{ github.run_id }}
          path: artifacts/pruning-efficiency
