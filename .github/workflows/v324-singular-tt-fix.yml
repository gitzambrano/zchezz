name: v3.24 Singular Excluded-Safe Screen

on:
  workflow_dispatch:
  push:
    branches:
      - exp/v324-singular-tt-fix

permissions:
  contents: read

env:
  STATIC_FLAG: ""

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -e ".[all]"
      - name: Build baseline
        run: |
          make -C engine/build ENGINE=v323 clean native CC=gcc ARCH_FLAGS="-mavx2" STATIC_FLAG=""
          cp engine/c/zchezz_v323/zchezz.exe /tmp/base.exe
          cp engine/c/zchezz_v323/nnue_weights.bin /tmp/nnue_weights.bin
      - name: Build excluded-safe candidate
        run: |
          python tools/v324_apply_singular_excluded.py safe
          git diff --check
          make -C engine/build ENGINE=v323 clean native CC=gcc ARCH_FLAGS="-mavx2" STATIC_FLAG=""
          python tests/test_perft.py --version v323 --max-depth 4
          python tests/test_uci_extended.py --version v323 --only T1 --only T2 --only T6 --only T9
          cp engine/c/zchezz_v323/zchezz.exe /tmp/safe.exe
          git checkout -- engine/c/zchezz_v323/search.c
      - name: Build no-singular candidate
        run: |
          python tools/v324_apply_singular_excluded.py nosingular
          git diff --check
          make -C engine/build ENGINE=v323 clean native CC=gcc ARCH_FLAGS="-mavx2" STATIC_FLAG=""
          python tests/test_perft.py --version v323 --max-depth 4
          cp engine/c/zchezz_v323/zchezz.exe /tmp/nosingular.exe
          git checkout -- engine/c/zchezz_v323/search.c
      - name: Benchmark tree
        run: |
          mkdir -p tests/arena_results
          python -c "import re,subprocess,json; w='/tmp/nnue_weights.bin'; ex={'base':'/tmp/base.exe','safe':'/tmp/safe.exe','nosingular':'/tmp/nosingular.exe'}; out={}; [out.__setitem__(k,int(re.search(r'Total nodes\\s*:\\s*(\\d+)',subprocess.run([v,'--nnue',w,'bench','11'],capture_output=True,text=True,check=True).stdout).group(1))) for k,v in ex.items()]; print(json.dumps(out,indent=2)); open('tests/arena_results/tree.json','w').write(json.dumps(out,indent=2))"
      - name: Generate openings
        run: |
          python -c "import random,chess,pathlib; r=random.Random(32426800); o=[]; s=set(); exec('while len(o)<384:\n b=chess.Board(); ok=True\n for _ in range(r.randint(8,22)):\n  ms=list(b.legal_moves)\n  if not ms: ok=False; break\n  qs=[m for m in ms if not b.is_capture(m)]\n  b.push(r.choice(qs if qs and r.random()<.72 else ms))\n  if b.is_game_over(claim_draw=True): ok=False; break\n if ok:\n  k=\" \".join(b.fen().split()[:4])\n  if k not in s: s.add(k); o.append(k)'); pathlib.Path('tests/arena_results/openings.epd').write_text('\\n'.join(o)+'\\n')"
      - name: Arena excluded-safe
        run: |
          python tests/run_arena.py --player uci:/tmp/safe.exe --player uci:/tmp/base.exe --games 1400 --movetime 0 --nodes 512 --threads 2 --max-plies 300 --openings "$GITHUB_WORKSPACE/tests/arena_results/openings.epd" --opening-plies 0 --seed 32426801 --tt-mb 8 --json tests/arena_results/safe-512.json --pgn tests/arena_results/safe-512.pgn
      - name: Arena no singular
        run: |
          python tests/run_arena.py --player uci:/tmp/nosingular.exe --player uci:/tmp/base.exe --games 1400 --movetime 0 --nodes 512 --threads 2 --max-plies 300 --openings "$GITHUB_WORKSPACE/tests/arena_results/openings.epd" --opening-plies 0 --seed 32426802 --tt-mb 8 --json tests/arena_results/nosingular-512.json --pgn tests/arena_results/nosingular-512.pgn
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v324-singular-excluded-safe
          path: tests/arena_results/
          if-no-files-found: warn
