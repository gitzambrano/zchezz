name: v3.26 LMR512 UHO confirmation

on:
  push:
    branches: [investigate/stockfish-search-gap]
    paths:
      - ".github/workflows/v326-lmr512-uho-confirm.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correctness:
    name: correctness candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build candidate and run correctness suite
        shell: bash
        run: |
          set -euo pipefail
          python tests/apply_v326_candidate.py --candidate no-check-extension
          python tests/apply_v326_candidate.py --candidate history-prune-64d
          python tests/apply_v326_candidate.py --candidate lmr-history-512
          make -C engine/build ENGINE=v325 native
          make -C engine/build ENGINE=v325 test-c
          python tests/test_perft.py --version v325
          python tests/test_uci_extended.py --version v325

  h2h:
    name: UHO H2H 200ms (shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4

      - name: Build original v3.25, candidate and arena
        shell: bash
        run: |
          set -euo pipefail
          SRC=engine/c/zchezz_v325/search.c
          make -C engine/build ENGINE=v325 native
          cp engine/c/zchezz_v325/zchezz.exe engine/c/zchezz_v325/zchezz_v325_original.exe

          python tests/apply_v326_candidate.py --candidate no-check-extension
          python tests/apply_v326_candidate.py --candidate history-prune-64d
          python tests/apply_v326_candidate.py --candidate lmr-history-512
          rm -f engine/c/zchezz_v325/zchezz.exe
          make -C engine/build ENGINE=v325 native
          cp engine/c/zchezz_v325/zchezz.exe engine/c/zchezz_v325/zchezz_lmr512.exe
          git checkout -- "$SRC"

          make -C engine/build ENGINE=v325 arena

      - name: Fetch pinned Stockfish UHO book and select disjoint openings
        shell: bash
        env:
          BOOK_COMMIT: 65815ccdbc7727cd4f6aee252ba8f67fb740e92f
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/book artifacts/h2h
          URL="https://raw.githubusercontent.com/official-stockfish/books/${BOOK_COMMIT}/UHO_4060_v4.epd.zip"
          curl -L --fail --retry 3 --retry-delay 2 "$URL" -o artifacts/book/uho.zip
          sha256sum artifacts/book/uho.zip | tee artifacts/book/uho.sha256
          EPD_NAME="$(unzip -Z1 artifacts/book/uho.zip | grep -Ei '\.epd$' | head -n1)"
          test -n "$EPD_NAME"
          unzip -p artifacts/book/uho.zip "$EPD_NAME" > artifacts/book/all.epd

          python - <<'PY'
          from pathlib import Path
          import os, random

          shard = int(os.environ['SHARD'])
          lines=[]
          for raw in Path('artifacts/book/all.epd').read_text(encoding='utf-8', errors='replace').splitlines():
              s=raw.strip()
              if not s or s.startswith('#'):
                  continue
              parts=s.split()
              if len(parts) < 4:
                  continue
              # Arena reads the first four FEN fields from EPD. Keep only these
              # so EPD operations cannot affect parsing and the corpus snapshot
              # is explicit in the artifact.
              lines.append(' '.join(parts[:4]))
          if len(lines) < 400:
              raise RuntimeError(f'need >=400 usable UHO positions, found {len(lines)}')
          rng=random.Random(326512)
          rng.shuffle(lines)
          chosen=lines[shard*50:(shard+1)*50]
          if len(chosen) != 50:
              raise RuntimeError(f'shard {shard}: expected 50 positions, got {len(chosen)}')
          out=Path('artifacts/h2h/openings.epd')
          out.write_text('\n'.join(chosen)+'\n', encoding='utf-8')
          print(f'UHO usable={len(lines)} shard={shard} selected={len(chosen)}')
          PY
          sha256sum artifacts/h2h/openings.epd | tee artifacts/h2h/openings.sha256

      - name: 100-game serial antithetic H2H at 200 ms
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(realpath engine/c/zchezz_v325/zchezz_v325_original.exe)"
          CAND="$(realpath engine/c/zchezz_v325/zchezz_lmr512.exe)"
          OUT="artifacts/h2h"
          SEED=$((326600 + ${{ matrix.shard }}))
          ./engine/build/arena.exe \
            --player "uci:${BASE}" --player "uci:${CAND}" \
            --games 100 --threads 1 --movetime 200 --nodes 0 --max-plies 400 \
            --openings "$OUT/openings.epd" --seed "$SEED" --tt-mb 64 --uci-timeout 15000 \
            --json "$OUT/result.json" --pgn "$OUT/games.pgn" 2>&1 | tee "$OUT/arena.log"
          cat "$OUT/result.json" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lmr512-uho-s${{ matrix.shard }}-${{ github.run_id }}
          path: |
            artifacts/h2h
            artifacts/book/uho.sha256

  aggregate:
    name: aggregate 800-game UHO confirmation
    runs-on: ubuntu-24.04
    if: always()
    needs: [correctness, h2h]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lmr512-uho-s*
          path: downloaded
          merge-multiple: false

      - name: Aggregate candidate-perspective result
        shell: python
        run: |
          from pathlib import Path
          import json, math

          files=list(Path('downloaded').glob('**/result.json'))
          if len(files) != 8:
              raise RuntimeError(f'expected 8 result.json files, got {len(files)}')
          w=d=l=0
          shard_rows=[]
          for p in sorted(files):
              pair=json.loads(p.read_text())['pairings'][0]
              # Player A = original v3.25; player B = candidate.
              cw, cd, cl = int(pair['l']), int(pair['d']), int(pair['w'])
              w += cw; d += cd; l += cl
              shard_rows.append((p.parts[1], cw, cd, cl))

          n=w+d+l
          s=(w+0.5*d)/n
          elo=400*math.log10(s/(1-s)) if 0<s<1 else (9999 if s==1 else -9999)
          second=(w+0.25*d)/n
          var=max(0.0, second-s*s)
          se=math.sqrt(var/n)
          deriv=400/math.log(10)/(s*(1-s)) if 0<s<1 else 0.0
          ci=1.96*deriv*se

          lines=[
              '# v3.26 LMR-history-512 UHO confirmation','',
              'Candidate = no-check-extension + history-prune-64d + lmr-history-512.',
              'Baseline = original v3.25. 200 ms; Threads=1; arena serial; Hash=64 MB; antithetic colors.',
              'Openings = Stockfish official UHO_4060_v4 pinned at books commit 65815ccdbc7727cd4f6aee252ba8f67fb740e92f.','',
              f'- Games: {n}', f'- W-D-L: {w}-{d}-{l}', f'- Score: {100*s:.3f}%',
              f'- Elo: {elo:+.2f} ± {ci:.2f} (approx. 95% CI)','',
              '| Shard artifact | W-D-L |','|---|---:|'
          ]
          lines += [f'| {name} | {sw}-{sd}-{sl} |' for name,sw,sd,sl in shard_rows]
          Path('aggregate.md').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          print(Path('aggregate.md').read_text())

      - run: cat aggregate.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: lmr512-uho-aggregate-${{ github.run_id }}
          path: aggregate.md
