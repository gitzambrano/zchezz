name: v3.24 Pawn Correction 100/200ms Confirmation

on:
  workflow_dispatch:
  push:
    branches: [exp/v324-pawncorr-200ms-confirm]

permissions:
  contents: read

env:
  STATIC_FLAG: ""

jobs:
  wall-clock-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - tag: 100ms-confirm
            games: 800
            movetime: 100
            seed: 32425100
          - tag: 200ms
            games: 800
            movetime: 200
            seed: 32425200

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -e ".[all]"

      - name: Build untouched v3.23 baseline
        shell: bash
        run: |
          set -euo pipefail
          make -C engine/build ENGINE=v323 clean native CC=gcc ARCH_FLAGS="-mavx2" STATIC_FLAG=""
          cp engine/c/zchezz_v323/zchezz.exe /tmp/zchezz-v323-base.exe

      - name: Apply pawn correction and build candidate
        shell: bash
        run: |
          set -euo pipefail
          python tools/v324_apply_pawn_correction.py
          git diff --check
          make -C engine/build ENGINE=v323 clean native CC=gcc ARCH_FLAGS="-mavx2" STATIC_FLAG=""
          cp engine/c/zchezz_v323/zchezz.exe /tmp/zchezz-v324-pawncorr.exe

      - name: Smoke candidate
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_perft.py --version v323 --max-depth 4
          python tests/test_uci_extended.py --version v323 --only T1 --only T2 --only T6 --only T9

      - name: Generate independent deterministic opening pool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/arena_results
          python - <<'PY'
          import random, chess
          from pathlib import Path
          rng = random.Random(3242501)
          rows=[]; seen=set()
          while len(rows) < 384:
              b=chess.Board(); ok=True
              for _ in range(rng.randint(8,22)):
                  moves=list(b.legal_moves)
                  if not moves:
                      ok=False; break
                  quiet=[m for m in moves if not b.is_capture(m)]
                  b.push(rng.choice(quiet if quiet and rng.random() < 0.72 else moves))
                  if b.is_game_over(claim_draw=True):
                      ok=False; break
              if not ok:
                  continue
              key=' '.join(b.fen().split()[:4])
              if key not in seen:
                  seen.add(key); rows.append(key)
          Path('tests/arena_results/pawncorr_confirm_openings.epd').write_text('\n'.join(rows)+'\n')
          print('openings', len(rows))
          PY

      - name: A/B ${{ matrix.tag }}
        shell: bash
        run: |
          set -euo pipefail
          python tests/run_arena.py \
            --player uci:/tmp/zchezz-v324-pawncorr.exe \
            --player uci:/tmp/zchezz-v323-base.exe \
            --games ${{ matrix.games }} --movetime ${{ matrix.movetime }} --nodes 0 \
            --threads 2 --max-plies 300 \
            --openings "$GITHUB_WORKSPACE/tests/arena_results/pawncorr_confirm_openings.epd" \
            --opening-plies 0 --seed ${{ matrix.seed }} --tt-mb 8 \
            --json "tests/arena_results/pawncorr-${{ matrix.tag }}.json" \
            --pgn "tests/arena_results/pawncorr-${{ matrix.tag }}.pgn"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v324-pawn-correction-${{ matrix.tag }}
          path: |
            tests/arena_results/pawncorr_confirm_openings.epd
            tests/arena_results/pawncorr-${{ matrix.tag }}.json
            tests/arena_results/pawncorr-${{ matrix.tag }}.pgn
          if-no-files-found: warn
