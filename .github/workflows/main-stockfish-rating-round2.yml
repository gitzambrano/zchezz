name: main-stockfish-rating-round2

on:
  push:
    branches: [bench/main-v323-stockfish-rating-round2-20260906]

permissions:
  contents: read

jobs:
  match:
    name: SF ${{ matrix.elo }} shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        elo: [2700, 2750, 2800, 2850]
        shard: [0, 1, 2, 3, 4]
    env:
      ARCH_FLAGS: -mavx2
      STATIC_FLAG: ""
      OPP_ELO: ${{ matrix.elo }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact main engine source
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < engine/ACTIVE_ENGINE)" = v323
          git diff --exit-code b6e197f6fb251b08a57fa838502befe7f23bfa8d HEAD -- engine/
      - name: Install dependencies and build without tablebases
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check python-chess
          sudo apt-get update -qq
          sudo apt-get install -y stockfish
          make -C engine/build ENGINE=v323 clean native CC=gcc
          printf 'uci\nisready\nquit\n' | engine/c/zchezz_v323/zchezz.exe --nnue engine/c/zchezz_v323/nnue_weights.bin | tee /tmp/zuci.txt
          grep -q 'id name Zchezz 3.23' /tmp/zuci.txt
          grep -q readyok /tmp/zuci.txt
      - name: Run 20 games (10 paired openings)
        shell: bash
        run: |
          set -euo pipefail
          SF="$(command -v stockfish || true)"
          if [ -z "$SF" ]; then SF=/usr/games/stockfish; fi
          export STOCKFISH="$SF"
          python - <<'PY'
          import json, os, random
          import chess
          import chess.engine

          elo = int(os.environ['OPP_ELO'])
          shard = int(os.environ['SHARD'])
          sf_path = os.environ['STOCKFISH']
          z_path = 'engine/c/zchezz_v323/zchezz.exe'
          weights = 'engine/c/zchezz_v323/nnue_weights.bin'
          move_time = 0.050
          max_plies = 200
          opening_ids = list(range(shard * 10, shard * 10 + 10))

          def cfg(engine, opts):
              use = {k:v for k,v in opts.items() if k in engine.options}
              if use:
                  engine.configure(use)

          # Build deterministic, reasonably normal 8-ply starting positions.
          # Full-strength Stockfish only proposes opening moves; every position is then
          # played twice with colors swapped, so opening choice does not favor a color.
          gen = chess.engine.SimpleEngine.popen_uci(sf_path, timeout=10.0)
          openings = []
          try:
              cfg(gen, {'Threads':1, 'Hash':64, 'UCI_LimitStrength':False, 'SyzygyPath':''})
              for opening_id in opening_ids:
                  rng = random.Random(3230906 + opening_id)
                  board = chess.Board()
                  moves = []
                  for _ply in range(8):
                      infos = gen.analyse(board, chess.engine.Limit(depth=5), multipv=4)
                      if not isinstance(infos, list):
                          infos = [infos]
                      cands=[]
                      for info in infos[:4]:
                          pv=info.get('pv') or []
                          if pv and pv[0] in board.legal_moves:
                              cands.append(pv[0])
                      if not cands:
                          raise RuntimeError('No opening candidate')
                      mv=rng.choices(cands, weights=[8,4,2,1][:len(cands)], k=1)[0]
                      moves.append(mv.uci())
                      board.push(mv)
                  openings.append((opening_id,moves))
          finally:
              gen.quit()

          z = chess.engine.SimpleEngine.popen_uci([z_path,'--nnue',weights], timeout=10.0)
          sf = chess.engine.SimpleEngine.popen_uci(sf_path, timeout=10.0)
          try:
              cfg(z, {'Threads':1, 'Hash':64, 'OwnBook':False})
              cfg(sf, {
                  'Threads':1, 'Hash':64,
                  'UCI_LimitStrength':True, 'UCI_Elo':elo,
                  'SyzygyPath':''
              })
              if 'UCI_LimitStrength' not in sf.options or 'UCI_Elo' not in sf.options:
                  raise RuntimeError('Stockfish lacks UCI strength limiting')
              syz_default = sf.options['SyzygyPath'].default if 'SyzygyPath' in sf.options else None
              print('STOCKFISH_SYZYGY_DEFAULT', repr(syz_default))

              results=[]
              for opening_id, opening in openings:
                  for z_white in (True,False):
                      board=chess.Board()
                      for u in opening:
                          mv=chess.Move.from_uci(u)
                          if mv not in board.legal_moves:
                              raise RuntimeError(f'Illegal opening move {u}')
                          board.push(mv)
                      start_ply=board.ply()
                      while board.outcome(claim_draw=True) is None and board.ply()-start_ply < max_plies:
                          z_turn=(board.turn == chess.WHITE) == z_white
                          eng=z if z_turn else sf
                          result=eng.play(board, chess.engine.Limit(time=move_time))
                          if result.move is None or result.move not in board.legal_moves:
                              raise RuntimeError(f'Illegal/null engine move: {result.move}')
                          board.push(result.move)

                      outcome=board.outcome(claim_draw=True)
                      if outcome is None:
                          game_result='1/2-1/2'; reason='ply-cap'
                      else:
                          game_result=outcome.result(); reason=str(outcome.termination)
                      if game_result == '1/2-1/2':
                          zscore=0.5
                      elif (game_result == '1-0' and z_white) or (game_result == '0-1' and not z_white):
                          zscore=1.0
                      else:
                          zscore=0.0
                      row={
                          'opponent_elo':elo,'shard':shard,'opening':opening_id,
                          'opening_moves':opening,'z_white':z_white,
                          'result':game_result,'zscore':zscore,
                          'plies_after_opening':board.ply()-start_ply,'termination':reason
                      }
                      results.append(row)
                      print('GAME', len(results), json.dumps(row,sort_keys=True),flush=True)

              wins=sum(r['zscore']==1 for r in results)
              draws=sum(r['zscore']==0.5 for r in results)
              losses=sum(r['zscore']==0 for r in results)
              points=wins+0.5*draws
              out={
                  'opponent_elo':elo,'shard':shard,'games':len(results),
                  'wins':wins,'draws':draws,'losses':losses,
                  'points':points,'score':points/len(results),
                  'move_time_ms':50,'constant_time_per_move':True,
                  'threads_each':1,'hash_mb_each':64,
                  'tablebases_zchezz':False,'tablebases_stockfish':False,
                  'opening_pairs':10,'games_detail':results
              }
              with open(f'match-{elo}-{shard}.json','w') as f:
                  json.dump(out,f,indent=2)
              print('SHARD_SUMMARY',json.dumps({k:v for k,v in out.items() if k!='games_detail'},sort_keys=True))
          finally:
              z.quit(); sf.quit()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: match-${{ matrix.elo }}-${{ matrix.shard }}
          path: match-${{ matrix.elo }}-${{ matrix.shard }}.json

  aggregate:
    name: Aggregate rating
    needs: match
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: match-*
          merge-multiple: true
      - name: Estimate Elo and confidence interval
        shell: bash
        run: |
          python - <<'PY'
          import glob,json,math,random

          raw=[]
          for fn in sorted(glob.glob('match-*.json')):
              with open(fn) as f: raw.append(json.load(f))
          if len(raw) != 20:
              raise RuntimeError(f'Expected 20 shards, got {len(raw)}')

          groups={}
          for x in raw:
              g=groups.setdefault(x['opponent_elo'],{
                  'opponent_elo':x['opponent_elo'],'games':0,'wins':0,'draws':0,
                  'losses':0,'points':0.0,'games_detail':[]
              })
              for k in ('games','wins','draws','losses'):
                  g[k]+=x[k]
              g['points']+=x['points']
              g['games_detail']+=x['games_detail']
          rows=[groups[e] for e in sorted(groups)]
          for x in rows: x['score']=x['points']/x['games']

          q=math.log(10)/400
          def pscore(r,opp): return 1/(1+10**((opp-r)/400))
          r=sum(x['opponent_elo'] for x in rows)/len(rows)
          for _ in range(100):
              grad=info=0.0
              for x in rows:
                  p=pscore(r,x['opponent_elo'])
                  grad += q*(x['points']-x['games']*p)
                  info += q*q*x['games']*p*(1-p)
              step=grad/info; r+=step
              if abs(step)<1e-10: break
          info=sum(q*q*x['games']*pscore(r,x['opponent_elo'])*(1-pscore(r,x['opponent_elo'])) for x in rows)
          se=1/math.sqrt(info)
          wald=[r-1.96*se,r+1.96*se]

          per=[]
          for x in rows:
              s=x['score']
              est=x['opponent_elo']+400*math.log10(s/(1-s)) if 0<s<1 else None
              per.append({
                  'opponent_elo':x['opponent_elo'],'games':x['games'],
                  'wins':x['wins'],'draws':x['draws'],'losses':x['losses'],
                  'score':s,'implied_zchezz_elo':est
              })

          # Paired bootstrap: resample whole two-game opening pairs inside each Elo group.
          rng=random.Random(3230906); boots=[]
          for _ in range(20000):
              bs=[]
              for x in rows:
                  pairs={}
                  for g in x['games_detail']:
                      pairs.setdefault(g['opening'],[]).append(g['zscore'])
                  vals=list(pairs.values())
                  if len(vals)!=50 or any(len(v)!=2 for v in vals):
                      raise RuntimeError('Pair structure corrupted')
                  sampled=[rng.choice(vals) for __ in vals]
                  bs.append((x['opponent_elo'],100,sum(sum(v) for v in sampled)))
              rr=r
              for __ in range(40):
                  grad=inf=0.0
                  for opp,n,pts in bs:
                      p=pscore(rr,opp)
                      grad+=q*(pts-n*p); inf+=q*q*n*p*(1-p)
                  st=grad/inf; rr+=st
                  if abs(st)<1e-8: break
              if math.isfinite(rr): boots.append(rr)
          boots.sort()
          bci=[boots[int(.025*len(boots))],boots[int(.975*len(boots))]]

          total_games=sum(x['games'] for x in rows)
          out={
              'main_sha':'b6e197f6fb251b08a57fa838502befe7f23bfa8d',
              'engine':'Zchezz 3.23',
              'protocol':{
                  'opponents':[2700,2750,2800,2850],
                  'games_per_opponent':100,'total_games':total_games,
                  'opening_pairs_per_opponent':50,'paired_colors':True,
                  'move_time_ms':50,'constant_time_per_move':True,
                  'threads_each':1,'hash_mb_each':64,
                  'tablebases_both_sides':False
              },
              'matches':per,'combined_rating_mle':r,
              'wald_95_ci':wald,'paired_bootstrap_95_ci':bci,
              'total_score':sum(x['points'] for x in rows)/total_games
          }
          with open('rating-result-round2.json','w') as f: json.dump(out,f,indent=2)
          print('FINAL_RATING_RESULT'); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rating-result-round2
          path: rating-result-round2.json
