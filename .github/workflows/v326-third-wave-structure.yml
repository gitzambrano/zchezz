name: v3.26 third-wave structural screen

on:
  push:
    branches: [investigate/stockfish-search-gap]
    paths:
      - ".github/workflows/v326-third-wave-structure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural:
    name: structural (${{ matrix.candidate }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        candidate:
          - nmp-plus2-margin64
          - nmp-plus2-margin128
          - lmr-negative-1024
          - lmr-negative-512
          - qs-delta-plus25
          - qs-delta-minus25
    steps:
      - uses: actions/checkout@v4
      - name: Build combined baseline and candidate
        shell: bash
        run: |
          set -euo pipefail
          SRC=engine/c/zchezz_v325/search.c
          make -C engine/build ENGINE=v325 native
          cp engine/c/zchezz_v325/zchezz.exe engine/c/zchezz_v325/zchezz_baseline.exe

          python tests/apply_v326_candidate.py --candidate no-check-extension
          python tests/apply_v326_candidate.py --candidate history-prune-64d
          python tests/apply_v326_candidate.py --candidate "${{ matrix.candidate }}"

          rm -f engine/c/zchezz_v325/zchezz.exe
          make -C engine/build ENGINE=v325 native
          make -C engine/build ENGINE=v325 test-c
          cp engine/c/zchezz_v325/zchezz.exe engine/c/zchezz_v325/zchezz_candidate.exe
          git checkout -- "$SRC"
      - name: Fresh-position fixed-depth screen
        shell: bash
        run: |
          set -euo pipefail
          OUT="artifacts/third-wave-${{ matrix.candidate }}"
          python tests/bench_v326_candidate_structure.py --output "$OUT"
          cat "$OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: third-wave-structure-${{ matrix.candidate }}-${{ github.run_id }}
          path: artifacts/third-wave-${{ matrix.candidate }}
