name: v3.26 symmetric LMR threshold structural screen

on:
  push:
    branches: [investigate/stockfish-search-gap]
    paths:
      - ".github/workflows/v326-lmr-threshold-structure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    name: LMR threshold ${{ matrix.threshold }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        threshold: [384, 512, 640, 768]
    steps:
      - uses: actions/checkout@v4
      - name: Build combined baseline and threshold candidate
        shell: bash
        run: |
          set -euo pipefail
          python tests/apply_v326_candidate.py --candidate no-check-extension
          python tests/apply_v326_candidate.py --candidate history-prune-64d
          make -C engine/build ENGINE=v325 native
          cp engine/c/zchezz_v325/zchezz.exe engine/c/zchezz_v325/zchezz_combined.exe
          python tests/apply_v326_lmr_symmetric.py --threshold "${{ matrix.threshold }}"
          rm -f engine/c/zchezz_v325/zchezz.exe
          make -C engine/build ENGINE=v325 native
          cp engine/c/zchezz_v325/zchezz.exe engine/c/zchezz_v325/zchezz_candidate.exe
      - name: C invariants and UCI smoke
        shell: bash
        run: |
          set -euo pipefail
          make -C engine/build ENGINE=v325 test-c
          python tests/test_uci_extended.py --version v325 --only T1 --only T2
      - name: Fresh-position fixed-depth screen
        shell: bash
        run: |
          set -euo pipefail
          OUT="artifacts/lmr-threshold-${{ matrix.threshold }}"
          python tests/bench_v326_candidate_structure.py \
            --baseline engine/c/zchezz_v325/zchezz_combined.exe \
            --candidate engine/c/zchezz_v325/zchezz_candidate.exe \
            --output "$OUT"
          cat "$OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lmr-threshold-${{ matrix.threshold }}-${{ github.run_id }}
          path: artifacts/lmr-threshold-${{ matrix.threshold }}
