name: v3.26 qdelta-25 fast gate

on:
  push:
    branches: [investigate/stockfish-search-gap]
    paths:
      - ".github/workflows/v326-qdelta25-fastgate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  h2h:
    name: qdelta-25 H2H 200ms (shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Build combined baseline, qdelta-25 candidate and arena
        shell: bash
        run: |
          set -euo pipefail
          python tests/apply_v326_candidate.py --candidate no-check-extension
          python tests/apply_v326_candidate.py --candidate history-prune-64d
          make -C engine/build ENGINE=v325 native
          cp engine/c/zchezz_v325/zchezz.exe engine/c/zchezz_v325/zchezz_combined.exe

          python tests/apply_v326_candidate.py --candidate qs-delta-minus25
          rm -f engine/c/zchezz_v325/zchezz.exe
          make -C engine/build ENGINE=v325 native
          cp engine/c/zchezz_v325/zchezz.exe engine/c/zchezz_v325/zchezz_qdelta25.exe
          make -C engine/build arena
      - name: Create deterministic paired openings
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('engine/c/zchezz_v325/main.c').read_text()
          m=re.search(r'BENCH_FENS\s*\[\s*\]\s*=\s*\{(.*?)\};',s,re.S)
          fs=re.findall(r'"([^"\\]*(?:\\.[^"\\]*)*)"',m.group(1))
          assert len(fs)==20
          shard=${{ matrix.shard }}
          k=(5*shard) % len(fs)
          fs=fs[k:]+fs[:k]
          p=Path(f'artifacts/qdelta25-s{shard}')
          p.mkdir(parents=True,exist_ok=True)
          (p/'openings.epd').write_text('\n'.join(fs)+'\n')
      - name: 25-game serial H2H at 200 ms
        shell: bash
        run: |
          set -euo pipefail
          OUT="artifacts/qdelta25-s${{ matrix.shard }}"
          BASE="$(realpath engine/c/zchezz_v325/zchezz_combined.exe)"
          CAND="$(realpath engine/c/zchezz_v325/zchezz_qdelta25.exe)"
          SEED=$((330000 + ${{ matrix.shard }}))
          ./engine/build/arena.exe \
            --player "uci:${BASE}" --player "uci:${CAND}" \
            --games 25 --threads 1 --movetime 200 --nodes 0 --max-plies 400 \
            --openings "$OUT/openings.epd" --seed "$SEED" --tt-mb 64 --uci-timeout 15000 \
            --json "$OUT/result.json" --pgn "$OUT/games.pgn" 2>&1 | tee "$OUT/arena.log"
          cat "$OUT/result.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qdelta25-fastgate-s${{ matrix.shard }}-${{ github.run_id }}
          path: artifacts/qdelta25-s${{ matrix.shard }}

  aggregate:
    name: aggregate qdelta-25 fast gate
    runs-on: ubuntu-24.04
    if: always()
    needs: [h2h]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qdelta25-fastgate-*
          path: downloaded
          merge-multiple: false
      - name: Aggregate result JSONs
        shell: python
        run: |
          from pathlib import Path
          import json, math

          w=d=l=0
          files=list(Path('downloaded').glob('**/result.json'))
          if len(files) != 4:
              raise RuntimeError(f'expected 4 result.json files, got {len(files)}')
          for p in files:
              pair=json.loads(p.read_text())['pairings'][0]
              # Player A = combined baseline; player B = qdelta-25 candidate.
              w += int(pair['l'])
              d += int(pair['d'])
              l += int(pair['w'])
          n=w+d+l
          s=(w+0.5*d)/n
          elo=400*math.log10(s/(1-s)) if 0<s<1 else (9999 if s==1 else -9999)
          second=(w+0.25*d)/n
          var=max(0.0, second-s*s)
          se=math.sqrt(var/n)
          deriv=400/math.log(10)/(s*(1-s)) if 0<s<1 else 0.0
          ci=1.96*deriv*se
          report=(
              '# qsearch delta -25 fast gate\n\n'
              'Candidate perspective vs combined base; 200 ms; Threads=1; arena serial; Hash=64 MB.\n\n'
              f'- Games: {n}\n'
              f'- W-D-L: {w}-{d}-{l}\n'
              f'- Score: {100*s:.2f}%\n'
              f'- Elo: {elo:+.1f} ± {ci:.1f} (approx. 95% CI)\n'
          )
          Path('aggregate.md').write_text(report)
          print(report)
      - run: cat aggregate.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: qdelta25-fastgate-aggregate-${{ github.run_id }}
          path: aggregate.md
