name: v326 no-check-extension H2H

on:
  push:
    branches: [v326-search-efficiency]
    paths:
      - ".github/workflows/v326-no-check-h2h.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  h2h:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build baseline
        run: |
          set -euo pipefail
          make -C engine/build ENGINE=v325 native
          cp engine/c/zchezz_v325/zchezz.exe engine/c/zchezz_v325/zchezz_baseline.exe
      - name: Build candidate
        run: |
          set -euo pipefail
          python tests/apply_v326_candidate.py --candidate no-check-extension
          rm -f engine/c/zchezz_v325/zchezz.exe
          make -C engine/build ENGINE=v325 native
          cp engine/c/zchezz_v325/zchezz.exe engine/c/zchezz_v325/zchezz_no_check.exe
          git checkout -- engine/c/zchezz_v325/search.c
      - name: Build serial arena
        run: |
          set -euo pipefail
          make -C engine/build arena
      - name: Create deterministic opening set
        shell: python
        run: |
          from pathlib import Path
          import re
          src=Path('engine/c/zchezz_v325/main.c').read_text(encoding='utf-8')
          m=re.search(r'BENCH_FENS\s*\[\s*\]\s*=\s*\{(.*?)\};',src,re.S)
          fens=re.findall(r'"([^"\\]*(?:\\.[^"\\]*)*)"',m.group(1)) if m else []
          if len(fens)!=20: raise SystemExit(f'expected 20 BENCH_FENS, got {len(fens)}')
          out=Path('artifacts/v326-no-check-h2h');out.mkdir(parents=True,exist_ok=True)
          (out/'openings.epd').write_text('\n'.join(fens)+'\n',encoding='utf-8')
      - name: Run 200ms serial H2H screen
        run: |
          set -euo pipefail
          BASE="$(realpath engine/c/zchezz_v325/zchezz_baseline.exe)"
          CAND="$(realpath engine/c/zchezz_v325/zchezz_no_check.exe)"
          ./engine/build/arena.exe \
            --player "uci:${BASE}" \
            --player "uci:${CAND}" \
            --games 40 --threads 1 --movetime 200 --nodes 0 --max-plies 400 \
            --openings artifacts/v326-no-check-h2h/openings.epd --seed 200809 \
            --tt-mb 64 --uci-timeout 15000 \
            --json artifacts/v326-no-check-h2h/result.json \
            2>&1 | tee artifacts/v326-no-check-h2h/arena.log
      - name: Verify protocol
        if: always()
        run: |
          set -euo pipefail
          test -f artifacts/v326-no-check-h2h/result.json
          ! grep -qi "weights not loaded" artifacts/v326-no-check-h2h/arena.log
          ! grep -qi "failed to respond" artifacts/v326-no-check-h2h/arena.log
          { echo '## v3.26 no-check-extension 200 ms H2H'; echo; cat artifacts/v326-no-check-h2h/result.json; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v326-no-check-h2h-${{ github.run_id }}
          path: artifacts/v326-no-check-h2h
