name: v3.24 TT PV Cutoff Screen

on:
  workflow_dispatch:
  push:
    branches: [exp/v324-tt-pv-cutoff-screen]

permissions:
  contents: read

env:
  STATIC_FLAG: ""

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -e ".[all]"

      - name: Build untouched v3.23 baseline
        shell: bash
        run: |
          set -euo pipefail
          make -C engine/build ENGINE=v323 clean native CC=gcc ARCH_FLAGS="-mavx2" STATIC_FLAG=""
          cp engine/c/zchezz_v323/zchezz.exe /tmp/base.exe
          cp engine/c/zchezz_v323/nnue_weights.bin /tmp/nnue_weights.bin

      - name: Build non-PV TT-cutoff candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('engine/c/zchezz_v323/search.c')
          s=p.read_text(encoding='utf-8')
          old='if (tte_hit == 1 && tte.depth >= depth && ply > 0 && ss->excluded_root_n == 0) {'
          new='if (tte_hit == 1 && tte.depth >= depth && ply > 0 && ss->excluded_root_n == 0 && (beta - alpha <= 1)) {'
          if s.count(old) != 1: raise SystemExit(f'anchor count={s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git diff --check
          make -C engine/build ENGINE=v323 clean native CC=gcc ARCH_FLAGS="-mavx2" STATIC_FLAG=""
          python tests/test_perft.py --version v323 --max-depth 4
          cp engine/c/zchezz_v323/zchezz.exe /tmp/nonpv.exe
          git checkout -- engine/c/zchezz_v323/search.c

      - name: Build exact-only-at-PV candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('engine/c/zchezz_v323/search.c')
          s=p.read_text(encoding='utf-8')
          pairs=[
            ('if (tte.flag == TT_LOWER && tte.score >= beta) return tte.score;',
             'if ((beta - alpha <= 1) && tte.flag == TT_LOWER && tte.score >= beta) return tte.score;'),
            ('if (tte.flag == TT_UPPER && tte.score <= alpha) return tte.score;',
             'if ((beta - alpha <= 1) && tte.flag == TT_UPPER && tte.score <= alpha) return tte.score;'),
          ]
          for old,new in pairs:
              if s.count(old) != 1: raise SystemExit(f'anchor count={s.count(old)}: {old}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          make -C engine/build ENGINE=v323 clean native CC=gcc ARCH_FLAGS="-mavx2" STATIC_FLAG=""
          python tests/test_perft.py --version v323 --max-depth 4
          cp engine/c/zchezz_v323/zchezz.exe /tmp/exactpv.exe
          git checkout -- engine/c/zchezz_v323/search.c

      - name: Tree and NPS benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/arena_results
          python - <<'PY'
          import json,re,statistics,subprocess,time
          from pathlib import Path
          w='/tmp/nnue_weights.bin'
          def bench(exe):
              t=time.perf_counter()
              p=subprocess.run([exe,'--nnue',w,'bench','11'],capture_output=True,text=True,check=True)
              dt=time.perf_counter()-t
              txt=p.stdout+p.stderr
              n=int(re.search(r'Total nodes\s*:\s*(\d+)',txt).group(1))
              return n,n/dt
          for name,exe in {'nonpv':'/tmp/nonpv.exe','exactpv':'/tmp/exactpv.exe'}.items():
              B=[]; C=[]
              for i in range(5):
                  order=(('b','/tmp/base.exe'),('c',exe)) if i%2==0 else (('c',exe),('b','/tmp/base.exe'))
                  for k,e in order: (B if k=='b' else C).append(bench(e))
              bn=B[0][0]; cn=C[0][0]
              b=statistics.median(x[1] for x in B); c=statistics.median(x[1] for x in C)
              out={'baseline_nodes':bn,'candidate_nodes':cn,'tree_delta_pct':100*(cn/bn-1),'baseline_median_nps':b,'candidate_median_nps':c,'nps_delta_pct':100*(c/b-1)}
              print(name, json.dumps(out,indent=2))
              Path(f'tests/arena_results/tree-{name}.json').write_text(json.dumps(out,indent=2))
          PY

      - name: Generate deterministic openings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import random,chess
          from pathlib import Path
          rng=random.Random(32426500)
          rows=[]; seen=set()
          while len(rows)<256:
              b=chess.Board(); ok=True
              for _ in range(rng.randint(8,22)):
                  moves=list(b.legal_moves)
                  if not moves: ok=False; break
                  quiet=[m for m in moves if not b.is_capture(m)]
                  b.push(rng.choice(quiet if quiet and rng.random()<0.72 else moves))
                  if b.is_game_over(claim_draw=True): ok=False; break
              if not ok: continue
              key=' '.join(b.fen().split()[:4])
              if key not in seen: seen.add(key); rows.append(key)
          Path('tests/arena_results/openings.epd').write_text('\n'.join(rows)+'\n')
          PY

      - name: Arena non-PV cutoff at 512 nodes
        shell: bash
        run: |
          set -euo pipefail
          python tests/run_arena.py \
            --player uci:/tmp/nonpv.exe --player uci:/tmp/base.exe \
            --games 1000 --movetime 0 --nodes 512 --threads 2 --max-plies 300 \
            --openings "$GITHUB_WORKSPACE/tests/arena_results/openings.epd" --opening-plies 0 \
            --seed 32426511 --tt-mb 8 \
            --json tests/arena_results/nonpv-512.json \
            --pgn tests/arena_results/nonpv-512.pgn

      - name: Arena exact-only-at-PV at 512 nodes
        shell: bash
        run: |
          set -euo pipefail
          python tests/run_arena.py \
            --player uci:/tmp/exactpv.exe --player uci:/tmp/base.exe \
            --games 1000 --movetime 0 --nodes 512 --threads 2 --max-plies 300 \
            --openings "$GITHUB_WORKSPACE/tests/arena_results/openings.epd" --opening-plies 0 \
            --seed 32426512 --tt-mb 8 \
            --json tests/arena_results/exactpv-512.json \
            --pgn tests/arena_results/exactpv-512.pgn

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v324-tt-pv-cutoff-screen
          path: tests/arena_results/
          if-no-files-found: warn
