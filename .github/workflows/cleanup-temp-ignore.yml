name: cleanup temp-ignore branch

on:
  push:
    branches: [investigate/stockfish-search-gap]
    paths:
      - ".github/workflows/cleanup-temp-ignore.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Delete superseded temp-ignore branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "temp-ignore" >/dev/null 2>&1; then
            git push origin --delete "temp-ignore"
          fi
