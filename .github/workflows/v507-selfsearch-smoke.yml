name: v507 self-search smoke
on:
  push:
    branches: [exp/v507-selfsearch-teacher]
    paths: [.github/workflows/v507-selfsearch-smoke.yml]
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e ".[dev]"
      - name: Build v507r
        run: make -C engine/build ENGINE=v507r STATIC_FLAG= ARCH_FLAGS=-mavx2 native
      - name: Root-probe teacher smoke
        run: |
          cat > /tmp/smoke.epd <<'EOF'
          rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq -
          r1bqk2r/pppp1ppp/2n2n2/2b1p3/2B1P3/2N2N2/PPPP1PPP/R1BQK2R w KQkq -
          8/8/8/3k4/3P4/3K4/8/8 w - -
          EOF
          export ZCHEZZ_STOCKFISH="$GITHUB_WORKSPACE/engine/c/zchezz_v507r/zchezz.exe"
          python train/teacher.py --input /tmp/smoke.epd --output /tmp/selfteacher-smoke \
            --limit 3 --workers 1 --batch-size 3 --max-in-flight 1 \
            --methods root_probe_policy --plugin train.teaching.selfsearch_methods \
            --shallow-nodes 300 --deep-nodes 300 --no-resume
          python train/teaching/inspect_dataset.py --input /tmp/selfteacher-smoke
          python - <<'PY'
          from train.teaching.format import TeachingDataset, MISSING_CP
          ds=TeachingDataset('/tmp/selfteacher-smoke')
          counts=[]; refined=[]
          for i in range(len(ds.positions)):
              moves=ds.moves_for(i)
              counts.append(len(moves))
              refined.append(sum(int(m['search_cp']) != int(MISSING_CP) for m in moves))
          print('moves_per_position=', counts)
          print('refined_per_position=', refined)
          assert min(counts) >= 4, counts
          assert min(refined) >= 2, refined
          PY
