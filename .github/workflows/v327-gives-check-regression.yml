name: v3.27 gives-check regression

on:
  push:
    branches: [investigate/stockfish-search-gap]
    paths:
      - ".github/workflows/v327-gives-check-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize experiment worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main v327-search-efficiency
          git worktree add --detach /tmp/v327 origin/main
          git show origin/v327-search-efficiency:tests/instrument_v327_gives_check.py > /tmp/instrument.py
          git show origin/v327-search-efficiency:tests/apply_v327_pawn_discovered_check.py > /tmp/fix.py
          git show origin/v327-search-efficiency:tests/bench_v327_gives_check_diagnostics.py > /tmp/bench_diag.py
      - name: Build baseline and diagnostic engines
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v327
          make -C engine/build ENGINE=v326 STATIC_FLAG= ARCH_FLAGS= TB_DEFS=-DNO_TABLEBASES native
          cp engine/c/zchezz_v326/zchezz.exe /tmp/zchezz_baseline.exe
          python /tmp/instrument.py --source engine/c/zchezz_v326/search.c
          rm -f engine/c/zchezz_v326/zchezz.exe
          make -C engine/build ENGINE=v326 STATIC_FLAG= ARCH_FLAGS= TB_DEFS=-DNO_TABLEBASES native
          cp engine/c/zchezz_v326/zchezz.exe /tmp/zchezz_diag.exe
      - name: Prove targeted false-negative hints with exact search parity
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v327
          PYTHONPATH=tests python /tmp/bench_diag.py \
            --baseline /tmp/zchezz_baseline.exe \
            --diagnostic /tmp/zchezz_diag.exe \
            --depth 6 \
            --output artifacts/v327-gives-check-diagnostic
          cat artifacts/v327-gives-check-diagnostic/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Build fixed candidate and run correctness
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v327
          git checkout -- engine/c/zchezz_v326/search.c
          python /tmp/fix.py --source engine/c/zchezz_v326/search.c
          rm -f engine/c/zchezz_v326/zchezz.exe
          make -C engine/build ENGINE=v326 STATIC_FLAG= ARCH_FLAGS= TB_DEFS=-DNO_TABLEBASES native
          cp engine/c/zchezz_v326/zchezz.exe engine/c/zchezz_v326/zchezz_candidate.exe
          cp /tmp/zchezz_baseline.exe engine/c/zchezz_v326/zchezz_baseline.exe
          make -C engine/build ENGINE=v326 STATIC_FLAG= ARCH_FLAGS= test-c
          python tests/test_perft.py --version v326
          python tests/test_uci.py --version v326
      - name: Structural depth screen
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v327
          python tests/bench_v327_candidate_structure.py \
            --baseline engine/c/zchezz_v326/zchezz_baseline.exe \
            --candidate engine/c/zchezz_v326/zchezz_candidate.exe \
            --source engine/c/zchezz_v326/main.c \
            --output artifacts/v327-gives-check-fix-structure
          cat artifacts/v327-gives-check-fix-structure/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v327-gives-check-regression-${{ github.run_id }}
          path: |
            /tmp/v327/artifacts/v327-gives-check-diagnostic
            /tmp/v327/artifacts/v327-gives-check-fix-structure
