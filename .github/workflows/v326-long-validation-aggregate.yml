name: v3.26 long validation aggregate

on:
  workflow_run:
    workflows: ["v3.26 long search validation"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Long-validation workflow run id"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  aggregate:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve source run
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=${{ inputs.run_id }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          pattern: long-h2h-*
          path: downloaded/long
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          pattern: cross-*
          path: downloaded/cross
      - name: Aggregate WDL and score
        shell: python
        run: |
          from pathlib import Path
          import json, math, re

          def elo(p):
              if p <= 0: return float('-inf')
              if p >= 1: return float('inf')
              return 400.0 * math.log10(p / (1.0 - p))

          def stats(w, d, l):
              n = w + d + l
              p = (w + 0.5*d) / n
              ex2 = (w + 0.25*d) / n
              var = max(0.0, ex2 - p*p)
              se = math.sqrt(var / n)
              lo = max(1e-9, p - 1.96*se)
              hi = min(1-1e-9, p + 1.96*se)
              e = elo(p)
              return n, p, e, elo(lo), elo(hi)

          baseline = {}
          for p in Path('downloaded/long').rglob('result.json'):
              art = p.parent.name
              # If download-artifact created another nesting level, use nearest
              # ancestor carrying the artifact name.
              for anc in p.parents:
                  if anc.name.startswith('long-h2h-'):
                      art = anc.name; break
              m = re.match(r'long-h2h-(.+)-s(\d+)-\d+$', art)
              if not m:
                  raise RuntimeError(f'unexpected long artifact path: {p}')
              cand = m.group(1)
              obj = json.loads(p.read_text())
              pair = obj['pairings'][0]
              # pair.w/d/l is P0 = baseline. Convert to candidate perspective.
              w, d, l = int(pair['l']), int(pair['d']), int(pair['w'])
              acc = baseline.setdefault(cand, [0,0,0,0])
              acc[0] += w; acc[1] += d; acc[2] += l; acc[3] += 1

          cross = {}
          for p in Path('downloaded/cross').rglob('result.json'):
              art = p.parent.name
              for anc in p.parents:
                  if anc.name.startswith('cross-'):
                      art = anc.name; break
              m = re.match(r'cross-(.+)-s(\d+)-\d+$', art)
              if not m:
                  raise RuntimeError(f'unexpected cross artifact path: {p}')
              matchup = m.group(1)
              obj = json.loads(p.read_text())
              pair = obj['pairings'][0]
              # P0 is the first engine named in the matchup.
              w, d, l = int(pair['w']), int(pair['d']), int(pair['l'])
              acc = cross.setdefault(matchup, [0,0,0,0])
              acc[0] += w; acc[1] += d; acc[2] += l; acc[3] += 1

          def table(groups, perspective):
              lines = [
                  f'Perspective: {perspective}', '',
                  '| group | shards | W | D | L | score | Elo | approx 95% Elo interval |',
                  '|---|---:|---:|---:|---:|---:|---:|---:|'
              ]
              for k,(w,d,l,shards) in sorted(groups.items()):
                  n,p,e,elo_lo,elo_hi = stats(w,d,l)
                  lines.append(f'| {k} | {shards} | {w} | {d} | {l} | {100*p:.2f}% | {e:+.1f} | [{elo_lo:+.1f}, {elo_hi:+.1f}] |')
              return '\n'.join(lines)

          text = (
              '# v3.26 long-validation aggregate\n\n'
              + table(baseline, 'candidate vs v3.25 baseline')
              + '\n\n## Cross matches\n\n'
              + table(cross, 'P0 = first engine in matchup name')
              + '\n'
          )
          print(text)
          Path('aggregate.md').write_text(text)
      - run: cat aggregate.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: v326-long-validation-correct-aggregate-${{ steps.source.outputs.run_id }}
          path: aggregate.md
