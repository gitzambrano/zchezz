name: v5.04 search promotion gate

on:
  push:
    branches:
      - v504-search-promote
    paths:
      - .github/workflows/v504-search-promotion.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize candidates
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main v503-search-port
          git worktree add --detach /tmp/base origin/main
          git worktree add --detach /tmp/cand-legacy origin/v503-search-port
          git worktree add --detach /tmp/cand-final origin/v503-search-port
          python3 "$GITHUB_WORKSPACE/tools/ci/v504_ci.py" patch --root /tmp/cand-final
          cd /tmp/cand-final
          git diff --check
          grep -q '#define ENGINE_VERSION "5.04"' engine/c/zchezz_v500/main.c
          ! grep -q 'tt->mask' engine/c/zchezz_v500/search.c

      - name: Build engines and arena
        shell: bash
        run: |
          set -euo pipefail
          make -C /tmp/base/engine/build ENGINE=v500 STATIC_FLAG= ARCH_FLAGS=-mavx2 TB_DEFS=-DNO_TABLEBASES native
          make -C /tmp/base/engine/build ENGINE=v326 STATIC_FLAG= ARCH_FLAGS=-mavx2 TB_DEFS=-DNO_TABLEBASES native
          make -C /tmp/cand-legacy/engine/build ENGINE=v500 STATIC_FLAG= ARCH_FLAGS=-mavx2 TB_DEFS=-DNO_TABLEBASES native
          make -C /tmp/cand-final/engine/build ENGINE=v500 STATIC_FLAG= ARCH_FLAGS=-mavx2 TB_DEFS=-DNO_TABLEBASES native
          make -C /tmp/cand-final/engine/build TOOLS_ENGINE=v500 STATIC_FLAG= ARCH_FLAGS=-mavx2 arena

      - name: Correctness smoke
        if: ${{ matrix.shard == 0 }}
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/cand-final
          # test-c still encodes the pre-compact NNU4 512/1024/32 layer contract;
          # current promoted v5.02 is 48/96/20, so it is not a valid v5 gate.
          python3 tests/test_perft.py --version v500
          python3 tests/test_uci_extended.py --version v500
          python3 tools/check_nnue.py --profile v500
          EXE=engine/c/zchezz_v500/zchezz.exe
          printf 'uci\nsetoption name Hash value 32\nisready\nsetoption name Hash value 64\nisready\nquit\n' | "$EXE" > /tmp/hash.out 2> /tmp/hash.err
          grep -q 'id name Zchezz 5.04' /tmp/hash.out
          grep -Eq '\[TT\] aos48: requested=32 MB actual=32\.000 MB' /tmp/hash.err
          grep -Eq '\[TT\] aos48: requested=64 MB actual=64\.000 MB' /tmp/hash.err

      - name: Prepare UHO openings
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          BOOK_COMMIT: 65815ccdbc7727cd4f6aee252ba8f67fb740e92f
        run: |
          set -euo pipefail
          cd /tmp/cand-final
          mkdir -p artifacts/uho
          curl -L --fail --retry 3 --retry-delay 2 "https://raw.githubusercontent.com/official-stockfish/books/${BOOK_COMMIT}/UHO_4060_v4.epd.zip" -o artifacts/uho/uho.zip
          EPD_NAME="$(unzip -Z1 artifacts/uho/uho.zip | grep -Ei '\.epd$' | head -n1)"
          unzip -p artifacts/uho/uho.zip "$EPD_NAME" > artifacts/uho/all.epd
          python3 "$GITHUB_WORKSPACE/tools/ci/v504_ci.py" openings --all artifacts/uho/all.epd --out artifacts/uho/openings.epd --shard "$SHARD"

      - name: Search-only match versus v5.02
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          cd /tmp/cand-final
          OUT="artifacts/shard-${SHARD}/search-v502"
          mkdir -p "$OUT"
          ./engine/build/arena.exe \
            --player "uci:$(realpath /tmp/base/engine/c/zchezz_v500/zchezz.exe)" \
            --player "uci:$(realpath /tmp/cand-legacy/engine/c/zchezz_v500/zchezz.exe)" \
            --games 64 --threads 1 --movetime 200 --nodes 0 --max-plies 400 \
            --openings artifacts/uho/openings.epd --seed $((504200 + SHARD)) \
            --tt-mb 64 --uci-timeout 15000 \
            --json "$OUT/result.json" --pgn "$OUT/games.pgn" 2>&1 | tee "$OUT/arena.log"

      - name: Final v5.04 match versus v3.26
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          cd /tmp/cand-final
          OUT="artifacts/shard-${SHARD}/final-v326"
          mkdir -p "$OUT"
          ./engine/build/arena.exe \
            --player "uci:$(realpath /tmp/base/engine/c/zchezz_v326/zchezz.exe)" \
            --player "uci:$(realpath engine/c/zchezz_v500/zchezz.exe)" \
            --games 64 --threads 1 --movetime 200 --nodes 0 --max-plies 400 \
            --openings artifacts/uho/openings.epd --seed $((504300 + SHARD)) \
            --tt-mb 64 --uci-timeout 15000 \
            --json "$OUT/result.json" --pgn "$OUT/games.pgn" 2>&1 | tee "$OUT/arena.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v504-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: /tmp/cand-final/artifacts/shard-${{ matrix.shard }}

  aggregate:
    runs-on: ubuntu-24.04
    needs: screen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: v504-shard-*-*
          path: downloaded
          merge-multiple: false
      - name: Aggregate results
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/v504_ci.py aggregate --downloaded downloaded --summary-json summary.json --summary-md summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: v504-promotion-summary-${{ github.run_id }}
          path: |
            summary.json
            summary.md

  promote:
    runs-on: ubuntu-24.04
    needs: aggregate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: v504-promotion-summary-${{ github.run_id }}
          path: gate
      - name: Promote when gate passes
        shell: bash
        env:
          EXPECTED_BASE: 0a150d0ca91aad3a5d300e6789a74d1ebff292ef
        run: |
          set -euo pipefail
          PROMOTE="$(python3 -c 'import json; print(str(json.load(open("gate/summary.json"))["promote"]).lower())')"
          if [ "$PROMOTE" != "true" ]; then
            echo 'v5.04 gate did not pass; main is unchanged.'
            exit 0
          fi

          git fetch origin main v503-search-port v504-search-promote
          if ! git diff --quiet "$EXPECTED_BASE"..origin/main -- engine/c/zchezz_v500; then
            echo 'main v500 changed since this experiment started; refusing autonomous promotion.' >&2
            git diff --stat "$EXPECTED_BASE"..origin/main -- engine/c/zchezz_v500 >&2
            exit 1
          fi
          git reset --hard origin/main
          git checkout origin/v503-search-port -- engine/c/zchezz_v500/main.c engine/c/zchezz_v500/search.c engine/c/zchezz_v500/search.h
          git checkout origin/v504-search-promote -- tools/ci/v504_ci.py
          python3 tools/ci/v504_ci.py patch --root .
          python3 tools/ci/v504_ci.py release --summary gate/summary.json --out docs/v504-release.md

          make -C engine/build ENGINE=v500 STATIC_FLAG= ARCH_FLAGS=-mavx2 TB_DEFS=-DNO_TABLEBASES clean native
          python3 tests/test_perft.py --version v500
          python3 tests/test_uci_extended.py --version v500
          python3 tools/check_nnue.py --profile v500
          printf 'uci\nsetoption name Hash value 32\nisready\nsetoption name Hash value 64\nisready\nquit\n' | engine/c/zchezz_v500/zchezz.exe > /tmp/final.out 2> /tmp/final.err
          grep -q 'id name Zchezz 5.04' /tmp/final.out
          grep -Eq '\[TT\] aos48: requested=32 MB actual=32\.000 MB' /tmp/final.err
          grep -Eq '\[TT\] aos48: requested=64 MB actual=64\.000 MB' /tmp/final.err
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine/c/zchezz_v500/main.c engine/c/zchezz_v500/search.c engine/c/zchezz_v500/search.h docs/v504-release.md tools/ci/v504_ci.py
          git commit -m 'release(v504): promote search port and Hash compliance'
          git push origin HEAD:main
