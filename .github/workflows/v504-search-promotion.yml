      - name: Final regression gates
        shell: bash
        run: |
          set -euo pipefail
          make -C engine/build ENGINE=v500 STATIC_FLAG= ARCH_FLAGS=-mavx2 TB_DEFS=-DNO_TABLEBASES clean native
          make -C engine/build ENGINE=v500 STATIC_FLAG= ARCH_FLAGS=-mavx2 TB_DEFS=-DNO_TABLEBASES test-c
          python3 tests/test_perft.py --version v500
          python3 tests/test_uci_extended.py --version v500
          python3 tools/check_nnue.py --profile v500
          printf 'uci\nsetoption name Hash value 32\nisready\nsetoption name Hash value 64\nisready\nquit\n' \
            | engine/c/zchezz_v500/zchezz.exe > /tmp/final.out 2> /tmp/final.err
          grep -q 'id name Zchezz 5.04' /tmp/final.out
          grep -Eq '\[TT\] aos48: requested=32 MB actual=32\.000 MB' /tmp/final.err
          grep -Eq '\[TT\] aos48: requested=64 MB actual=64\.000 MB' /tmp/final.err
          git diff --check

      - name: Commit promotion to live main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engine/c/zchezz_v500/main.c engine/c/zchezz_v500/search.c engine/c/zchezz_v500/search.h docs/v504-release.md
          git commit -m 'release(v504): promote search port and Hash compliance'
          git push origin HEAD:main
