name: cleanup stale branches

on:
  push:
    branches: [investigate/stockfish-search-gap]
    paths:
      - ".github/workflows/cleanup-stale-branches.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Delete verified stale branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            "infra/dual-family-cleanup" \
            "noop" \
            "v326-search-efficiency" \
            "v502-distill-capacity-ci"
          do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            else
              echo "already absent: $branch"
            fi
          done
