name: cleanup stale branches

on:
  push:
    branches: [investigate/stockfish-search-gap]
    paths:
      - ".github/workflows/cleanup-stale-branches.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Delete superseded structural branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete "v325-stockfish19-structural"
