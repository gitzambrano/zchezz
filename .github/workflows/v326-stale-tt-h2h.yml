name: v326 stale-generation TT H2H

on:
  push:
    branches: [v326-search-efficiency]
    paths:
      - ".github/workflows/v326-stale-tt-h2h.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  h2h:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build baseline v3.25
        shell: bash
        run: |
          set -euo pipefail
          make -C engine/build ENGINE=v325 native
          cp engine/c/zchezz_v325/zchezz.exe engine/c/zchezz_v325/zchezz_baseline.exe

      - name: Build stale-generation-miss candidate
        shell: bash
        run: |
          set -euo pipefail
          python tests/instrument_v325_search.py --no-diagnostics --stale-miss
          rm -f engine/c/zchezz_v325/zchezz.exe
          make -C engine/build ENGINE=v325 native
          cp engine/c/zchezz_v325/zchezz.exe engine/c/zchezz_v325/zchezz_stale_miss.exe
          git checkout -- engine/c/zchezz_v325/search.c

      - name: Build serial arena
        shell: bash
        run: |
          set -euo pipefail
          make -C engine/build arena

      - name: Create deterministic antithetic opening set
        shell: python
        run: |
          from pathlib import Path
          import re
          src = Path("engine/c/zchezz_v325/main.c").read_text(encoding="utf-8")
          m = re.search(r"BENCH_FENS\s*\[\s*\]\s*=\s*\{(.*?)\};", src, re.S)
          if not m:
              raise SystemExit("BENCH_FENS not found")
          fens = re.findall(r'"([^"\\]*(?:\\.[^"\\]*)*)"', m.group(1))
          if len(fens) != 20:
              raise SystemExit(f"expected 20 BENCH_FENS, got {len(fens)}")
          out = Path("artifacts/v326-stale-h2h")
          out.mkdir(parents=True, exist_ok=True)
          (out / "openings.epd").write_text("\n".join(fens) + "\n", encoding="utf-8")

      - name: Run 200ms serial H2H screen
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(realpath engine/c/zchezz_v325/zchezz_baseline.exe)"
          CAND="$(realpath engine/c/zchezz_v325/zchezz_stale_miss.exe)"
          ./engine/build/arena.exe \
            --player "baseline=uci:${BASE}" \
            --player "stale-miss=uci:${CAND}" \
            --games 40 \
            --threads 1 \
            --movetime 200 \
            --nodes 0 \
            --max-plies 400 \
            --openings artifacts/v326-stale-h2h/openings.epd \
            --seed 200809 \
            --tt-mb 64 \
            --uci-timeout 15000 \
            --json artifacts/v326-stale-h2h/result.json \
            --pgn artifacts/v326-stale-h2h/games.pgn \
            2>&1 | tee artifacts/v326-stale-h2h/arena.log

      - name: Verify protocol and publish summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/v326-stale-h2h/result.json
          ! grep -qi "weights not loaded" artifacts/v326-stale-h2h/arena.log
          ! grep -qi "failed to respond" artifacts/v326-stale-h2h/arena.log
          {
            echo "## v3.26 stale-generation TT 200 ms H2H screen"
            echo
            echo '- movetime: 200 ms'
            echo '- engine Threads: 1 (v3.25 UCI default)'
            echo '- arena concurrency: 1'
            echo '- Hash: 64 MB (v3.25 UCI default)'
            echo '- tablebases: disabled at compile time'
            echo '- OwnBook: false, MultiPV: 1, Ponder: false (UCI defaults)'
            echo '- 20 deterministic FENs, antithetic colors; 40 games total'
            echo
            echo '```json'
            cat artifacts/v326-stale-h2h/result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload H2H evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v326-stale-tt-h2h-${{ github.run_id }}
          path: artifacts/v326-stale-h2h
