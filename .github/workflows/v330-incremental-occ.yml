name: v3.30 incremental occupancy

on:
  push:
    branches: [exp/v330-incremental-occ]
  workflow_dispatch:

jobs:
  ab:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: nodes512, games: 500, movetime: 0, nodes: 512, seed: 3300512}
          - {label: 50ms, games: 300, movetime: 50, nodes: 0, seed: 3300050}
          - {label: 200ms, games: 160, movetime: 200, nodes: 0, seed: 3300200}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify common baseline
        run: git diff --exit-code 1a1df3ebcc207a888c4355d512d582db73b3f24d HEAD -- engine/
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -e ".[all]"
      - name: Build untouched v3.23 baseline
        run: |
          make -C engine/build ENGINE=v323 clean native CC=gcc ARCH_FLAGS="-mavx2" STATIC_FLAG=""
          cp engine/c/zchezz_v323/zchezz.exe /tmp/base.exe
      - name: Materialize v3.30 incremental-occupancy candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          main=Path('engine/c/zchezz_v323/main.c'); s=main.read_text(encoding='utf-8')
          old='#define ENGINE_VERSION "3.23"'; assert s.count(old)==1
          main.write_text(s.replace(old,'#define ENGINE_VERSION "3.30"',1),encoding='utf-8')

          p=Path('engine/c/zchezz_v323/board.c'); s=p.read_text(encoding='utf-8')
          old='''static inline void uf_bb_clr(Board *b, UndoFrame *uf, int bi, int sq) {
    if ((unsigned)bi >= 12u) return;  /* SMP guard: P2BI[0]=-1 from corrupt TT move */
    int was = !!(b->bb[bi] & ((uint64_t)1<<sq));
    uf_bb_record(uf, bi, sq, was);
    b->bb[bi] &= ~((uint64_t)1<<sq);
}
static inline void uf_bb_set(Board *b, UndoFrame *uf, int bi, int sq) {
    if ((unsigned)bi >= 12u) return;  /* SMP guard */
    int was = !!(b->bb[bi] & ((uint64_t)1<<sq));
    uf_bb_record(uf, bi, sq, was);
    b->bb[bi] |= ((uint64_t)1<<sq);
}'''
          new='''static inline void uf_bb_clr(Board *b, UndoFrame *uf, int bi, int sq) {
    if ((unsigned)bi >= 12u) return;  /* SMP guard: P2BI[0]=-1 from corrupt TT move */
    uint64_t bit = (uint64_t)1 << sq;
    int was = !!(b->bb[bi] & bit);
    uf_bb_record(uf, bi, sq, was);
    b->bb[bi] &= ~bit;
    /* v3.30: occupancy follows each actual bitboard mutation. */
    if (was) {
        b->occ &= ~bit;
        if (bi < 6) b->occ_w &= ~bit;
        else        b->occ_b &= ~bit;
    }
}
static inline void uf_bb_set(Board *b, UndoFrame *uf, int bi, int sq) {
    if ((unsigned)bi >= 12u) return;  /* SMP guard */
    uint64_t bit = (uint64_t)1 << sq;
    int was = !!(b->bb[bi] & bit);
    uf_bb_record(uf, bi, sq, was);
    b->bb[bi] |= bit;
    if (!was) {
        b->occ |= bit;
        if (bi < 6) b->occ_w |= bit;
        else        b->occ_b |= bit;
    }
}'''
          assert s.count(old)==1,s.count(old); s=s.replace(old,new,1)

          old='''    /* Incremental occupancy update (Phase 4 v212B):
     * Instead of rebuilding from 12 ORs, compute occ from the old saved value.
     * The bb[] array has already been updated, so we can derive occ cheaply
     * by XOR-ing the from/to/capture bits. But it's even safer and simpler
     * to just compute from the 6 bb per side (only 5+5 ORs vs 12). */
    b->occ_w = b->bb[0]|b->bb[1]|b->bb[2]|b->bb[3]|b->bb[4]|b->bb[5];
    b->occ_b = b->bb[6]|b->bb[7]|b->bb[8]|b->bb[9]|b->bb[10]|b->bb[11];
    b->occ   = b->occ_w | b->occ_b;'''
          new='''    /* v3.30: occ/occ_w/occ_b were already updated by uf_bb_clr/set.
     * board_unmake restores the saved pre-move occupancy in O(1). */'''
          assert s.count(old)==1,s.count(old); s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          make -C engine/build ENGINE=v323 clean native CC=gcc ARCH_FLAGS="-mavx2" STATIC_FLAG=""
          cp engine/c/zchezz_v323/zchezz.exe /tmp/cand.exe
          printf 'uci\nquit\n' | /tmp/cand.exe | grep -F 'id name Zchezz 3.30'
          python tests/test_perft.py --version v323 --max-depth 4
      - name: Generate common deterministic openings
        env: {OPENING_SEED: '${{ matrix.seed }}'}
        run: |
          mkdir -p tests/arena_results
          python - <<'PY'
          import os,random,chess
          from pathlib import Path
          r=random.Random(int(os.environ['OPENING_SEED'])); out=[]; seen=set()
          while len(out)<256:
              b=chess.Board(); ok=True
              for _ in range(r.randint(8,22)):
                  ms=list(b.legal_moves)
                  if not ms: ok=False; break
                  qs=[m for m in ms if not b.is_capture(m)]
                  b.push(r.choice(qs if qs and r.random()<.72 else ms))
                  if b.is_game_over(claim_draw=True): ok=False; break
              if not ok: continue
              k=' '.join(b.fen().split()[:4])
              if k not in seen: seen.add(k); out.append(k)
          Path('tests/arena_results/openings.epd').write_text('\n'.join(out)+'\n')
          PY
      - name: A/B ${{ matrix.label }}
        run: |
          python tests/run_arena.py --player uci:/tmp/cand.exe --player uci:/tmp/base.exe \
            --games ${{ matrix.games }} --movetime ${{ matrix.movetime }} --nodes ${{ matrix.nodes }} \
            --threads 2 --max-plies 300 --openings "$GITHUB_WORKSPACE/tests/arena_results/openings.epd" \
            --opening-plies 0 --seed ${{ matrix.seed }} --tt-mb 8 \
            --json "tests/arena_results/${{ matrix.label }}.json" --pgn "tests/arena_results/${{ matrix.label }}.pgn"
      - uses: actions/upload-artifact@v4
        with:
          name: v330-incremental-occ-${{ matrix.label }}
          path: tests/arena_results/
