name: v323-pk17-10ms

on:
  workflow_dispatch:
  push:
    branches: [v323-fullacc-endgame-test]
    paths:
      - '.github/workflows/v323-pk17-10ms.yml'

permissions:
  contents: read

env:
  STATIC_FLAG: ''
  ARCH_FLAGS: '-mavx2'

jobs:
  arena10:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check python-chess
      - name: Prepare engines and openings
        shell: bash
        run: |
          set -euo pipefail
          cp -a engine/c/zchezz_v322 engine/c/zchezz_v323base
          cp -a engine/c/zchezz_v322 engine/c/zchezz_v323pk17
          python tools/v323_run_pk17_split.py --root engine/c/zchezz_v323pk17
          make -C engine/build ENGINE=v323base clean native
          make -C engine/build ENGINE=v323pk17 clean native
          make -C engine/build TOOLS_ENGINE=v403 arena
          mkdir -p artifacts/v323-pk17-10ms
          python - <<'PY'
          import chess,random
          from pathlib import Path
          r=random.Random(3231710); rows=[]; seen=set()
          while len(rows)<256:
              b=chess.Board()
              for _ in range(r.randint(8,22)):
                  ms=list(b.legal_moves)
                  if not ms: break
                  q=[m for m in ms if not b.is_capture(m)]
                  b.push(r.choice(q if q and r.random()<.72 else ms))
                  if b.is_game_over(claim_draw=True): break
              if not b.is_game_over(claim_draw=True):
                  k=' '.join(b.fen().split()[:4])
                  if k not in seen: seen.add(k); rows.append(k)
          Path('v323-pk17-10ms.epd').write_text('\n'.join(rows)+'\n')
          PY
      - name: Timed 10ms 512 games
        shell: bash
        run: |
          set -euo pipefail
          python tests/run_arena.py \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v323pk17/zchezz.exe" \
            --player "uci:$GITHUB_WORKSPACE/engine/c/zchezz_v323base/zchezz.exe" \
            --games 512 --threads 4 --movetime 10 --max-plies 240 \
            --openings v323-pk17-10ms.epd --opening-plies 0 --seed 3231710 --tt-mb 16 \
            --json artifacts/v323-pk17-10ms/timed10ms.json --pgn artifacts/v323-pk17-10ms/timed10ms.pgn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v323-pk17-10ms
          path: artifacts/v323-pk17-10ms/
