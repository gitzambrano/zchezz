name: v323-pk17-nps-only

on:
  workflow_dispatch:
  push:
    branches: [v323-fullacc-endgame-test]
    paths:
      - '.github/workflows/v323-pk17-nps-only.yml'

permissions:
  contents: read

env:
  STATIC_FLAG: ''
  ARCH_FLAGS: '-mavx2'

jobs:
  nps:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare and build
        shell: bash
        run: |
          set -euo pipefail
          cp -a engine/c/zchezz_v322 engine/c/zchezz_v323base
          cp -a engine/c/zchezz_v322 engine/c/zchezz_v323pk17
          python tools/v323_run_pk17_split.py --root engine/c/zchezz_v323pk17
          make -C engine/build ENGINE=v323base clean native
          make -C engine/build ENGINE=v323pk17 clean native
          mkdir -p artifacts/v323-pk17-nps
      - name: 21 paired benches
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 21); do
            if (( i % 2 )); then
              engine/c/zchezz_v323base/zchezz.exe bench 11 | tee -a artifacts/v323-pk17-nps/base.txt
              engine/c/zchezz_v323pk17/zchezz.exe bench 11 | tee -a artifacts/v323-pk17-nps/pk17.txt
            else
              engine/c/zchezz_v323pk17/zchezz.exe bench 11 | tee -a artifacts/v323-pk17-nps/pk17.txt
              engine/c/zchezz_v323base/zchezz.exe bench 11 | tee -a artifacts/v323-pk17-nps/base.txt
            fi
          done
          python - <<'PY'
          import json,re,statistics
          from pathlib import Path
          d=Path('artifacts/v323-pk17-nps')
          def g(name,pat): return [int(x) for x in re.findall(pat,(d/name).read_text())]
          bn=g('base.txt',r'Total nodes\s*:\s*(\d+)'); cn=g('pk17.txt',r'Total nodes\s*:\s*(\d+)')
          bp=g('base.txt',r'Nodes/sec\s*:\s*(\d+)'); cp=g('pk17.txt',r'Nodes/sec\s*:\s*(\d+)')
          assert len(bn)==len(cn)==len(bp)==len(cp)==21 and bn==cn
          ratios=[c/b for b,c in zip(bp,cp)]
          out={'nodes':bn[0],'base_median':statistics.median(bp),'candidate_median':statistics.median(cp),
               'median_paired_pct':(statistics.median(ratios)-1)*100,
               'ratio_medians_pct':(statistics.median(cp)/statistics.median(bp)-1)*100,
               'paired_pct':[(x-1)*100 for x in ratios]}
          print('V323_PK17_NPS='+json.dumps(out,separators=(',',':')))
          (d/'summary.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v323-pk17-nps-only
          path: artifacts/v323-pk17-nps/
